  case 'u18':{const ps=ev.ids.map(pById).filter(Boolean);openModal(`<h2>U-18日本代表 選考</h2><div class="hint">以下の選手が日本代表に選ばれました。出場を許可すると大きな経験値を得られますが、活躍できなかったりチームが惨敗するとマイナス特能を持ち帰ることがあります。MVP級の活躍なら固有特能を獲得します。</div>${ps.map(p=>`<label class="check"><input type="checkbox" class="u18chk" value="${p.id}" checked> <span><b>${esc(p.name)}</b>（${p.grade}年 ${esc(playerPosLabel(p))}）${rk(rating(p))} 疲労${Math.round(p.fatigue)}</span></label>`).join('')}<div style="margin-top:10px">${b('決定','u18Go',{},'primary big')}</div>`,true);break;}
  case 'budget':showBudgetModal();break;
  case 'invite':{openModal(`<h2>春の招待大会</h2><div class="hint">選抜高校野球には選ばれなかったため、招待大会で春を戦います。強豪校が揃う大会ほど経験値は大きいですが、大敗が続くとあまり得られません。費用は不要。</div>${b('春季交流招待大会（8校・中堅校中心）','inviteGo',{k:'invite1'},'optbtn')}${b('強豪校招待大会（8校・各地の強豪）','inviteGo',{k:'invite2'},'optbtn')}${b('参加しない','qShift',{},'optbtn ghost')}`,true);break;}
  case 'graduation':showCareerModal('grad');break;
  case 'career':showCareerModal('career');break;
  case 'draft':startDraftUI(ev);break;
  case 'yearEnd':{const h=G.history[G.history.length-1]||{};openModal(`<h2>${G.calYear}年度 まとめ</h2><div class="kv"><b>大会成績</b><span>${Object.keys(h.results||{}).map(k=>`${TOURNEY_DEFS[k].name.replace('○○',G.school.pref).replace('△△',G.school.region)}：${h.results[k]}`).join('<br>')||'なし'}</span><b>評判</b><span>${h.rep}</span><b>収入／支出</b><span class="money">${yen(h.income||0)} ／ ${yen(h.expense||0)}</span><b>残金</b><span class="money ${(h.money||0)<0?'neg':''}">${yen(h.money||0)}</span><b>来年度予算係数</b><span>${Math.round((G.nextBudgetMult||1)*100)}%</span></div><div class="hint">来週から新年度。新入部員が入部します。</div><div style="margin-top:10px">${b('次の年度へ','qShift',{},'primary big')}</div>`,true);break;}
  case 'event':showEventModal(ev);break;
  case 'msg':openModal(`<h2>${esc(ev.title)}</h2><p style="white-space:pre-line">${esc(ev.body)}</p>${b('OK','qShift',{},'primary')}`,true);break;
  case 'goal':{const g=G.goal;if(ev.fired){const h=G.history;const yrs=h.length;const best=h.map(x=>x.results.koshien?'甲子園'+x.results.koshien:x.results.pref?'県大会'+x.results.pref:'').filter(Boolean);openModal(`<h2>解任通告</h2><div class="ribbon">GAME OVER</div><p>理事会は今年度の目標「${esc(g.text||'')}」が果たされなかったこと（${esc(ev.notes.join('、'))}）を受け、${esc(G.coach.name)}監督の解任を決定しました。信頼度 ${ev.trust}。</p><div class="kv"><b>在任</b><span>${yrs}年</span><b>主な成績</b><span>${best.map(esc).join('<br>')||'なし'}</span><b>評判</b><span>${G.rep}</span><b>卒業生</b><span>${G.graduates.length}人（プロ入り ${G.graduates.filter(x=>x.path==='プロ'||x.path==='MLB').length}人）</span></div><div class="hint">このデータは閲覧できますが、週を進めることはできません。</div><div class="wrap" style="margin-top:10px">${b('記録を眺める','qShift',{},'')}${b('新しいゲームを始める','newGameYes',{},'danger')}</div>`,true);}
   else openModal(`<h2>理事会の評価</h2><div class="ribbon">${ev.ok?'目標達成！':'目標未達…'}</div><div class="small">${ev.notes.map(esc).join('<br>')}</div><div class="row small" style="margin-top:8px"><span>信頼度</span><span class="num">${ev.trust}/100（${ev.d>=0?'+':''}${ev.d}）</span></div><div class="bar"><i class="${ev.trust<30?'bad':ev.trust<50?'warn':''}" style="width:${clamp(ev.trust,0,100)}%"></i></div><div class="hint">${ev.ok?'来年度の目標は一段階上がります。':'来年度も同じ目標です。信頼度が0になると解任されます。'}</div><div style="margin-top:10px">${b('OK','qShift',{},'primary big')}</div>`,true);break;}
  default:G.queue.shift();render();}}

function showBudgetModal(){const c=G.committee&&!G.committee.done&&G.committee.year===G.calYear?G.committee:Object.assign(committeeStart(),{year:G.calYear});G.committee=c;
 const log=c.log.map(l=>`<div class="notice"><b>${esc(l.name)}</b> → ${esc(l.react)}（${l.d>=0?'+':''}${l.d}）</div>`).join('');
 let body='';
 if(c.round<=3){body=`<div class="hint">発言${c.round}/3：委員会に訴える内容を選んでください。</div>${committeeOptions().map(o=>b(`${esc(o.name)}<small>${esc(o.hint)}</small>`,'budgetChoose',{id:o.id},'optbtn')).join('')}`;}
 else{body=`<div class="hint">最後に来年度の増額幅を要求します。委員会の空気が良いほど大きな要求が通りやすく、失敗すると据え置きか減額になります。</div>${[[5,'控えめ（+5%）'],[15,'標準（+15%）'],[30,'強気（+30%）'],[50,'大胆（+50%）']].map(x=>b(x[1]+`<small>成功率 ${Math.round(clamp(0.5+(c.mood-50)/60-(x[0]-15)/100,0.05,0.95)*100)}%</small>`,'budgetReq',{p:x[0]},'optbtn')).join('')}`;}

/* ================= 進路面談（9月）・卒業（3月）・ドラフト（10月） ================= */
function gradList(){return G.players.filter(p=>p.grade===3);}
function persuadeProb(p,wish,target){if(target===wish)return 1;let pr=0.5+G.coach.level*0.04+(alumniEff('nego')?0.1:0);const r=rating(p);const order={就職:0,社会人:1,大学:2,プロ:3,MLB:4};const up=order[target]>order[wish];if(up&&r>=80)pr+=0.15;if(!up&&r>=75)pr-=0.2;if(target==='就職'&&p.academic>=65)pr+=0.1;if(G.coach.type==='外部')pr+=0.05;return clamp(pr,0.1,0.95);}
const PATH_DETAIL={プロ:'プロ志望届を提出。10月のドラフト会議を待つ',MLB:'海外挑戦を表明。MLB球団との交渉へ',大学:'大学に進学して野球を続ける',社会人:'社会人野球チームへ',就職:'野球を離れ、学力に応じた進路へ'};
function careerTargets(mode){return mode==='grad'?gradList().filter(p=>!p.path):gradList().filter(p=>!p.path);}
function showCareerModal(mode){const th=careerTargets(mode);if(!th.length){if(mode==='grad')finishGraduation();else finishCareer();return;}
 if(!G.gradWish||G.gradWish.year!==G.calYear||G.gradWish.mode!==mode){G.gradWish={year:G.calYear,mode,w:{},i:0,decided:{}};for(const p of th)G.gradWish.w[p.id]=playerWish(p);}
 const gw=G.gradWish;if(gw.i>=th.length){if(mode==='grad')finishGraduation();else finishCareer();return;}
 const p=th[gw.i];const wish=gw.w[p.id];const dec=gw.decided[p.id];const c=p.career;const line=isPitcher(p)?`通算${c.g}試合 ${c.w}勝${c.l}敗 ${c.pk}奪三振 防御率${c.ipo?(c.per*27/c.ipo).toFixed(2):'-'}`:`通算${c.g}試合 打率${c.ab?(c.h/c.ab).toFixed(3):'-'} ${c.h}安打 ${c.hr}本塁打 ${c.rbi}打点 ${c.sb}盗塁`;
 const card=`<div class="row" style="align-items:flex-start;gap:10px">${avatarFor({pid:p.id,size:80})}<div class="kv" style="flex:1"><b>選手</b><span><b>${esc(p.name)}</b>（${esc(playerPosLabel(p))}）</span><b>総合</b><span>${rk(rating(p))} 潜在 ${esc(shownPot(p))}</span><b>学力</b><span>${p.academic}</span><b>成績</b><span class="small">${line}</span><b>特能</b><span>${abilHtml(p)}</span></div></div>`;
 let body='';
 if(!dec){const opts=careerOptions(p);body=`<div class="talk"><div class="who">${esc(p.name)}</div>${esc(gradTalk(p,wish))}</div><div class="hint">本人の希望：<b>${esc(wish)}</b>。監督としてどう答えますか？（説得の成功率は監督レベル・卒業生の効果・本人の実力で変わります）</div>${opts.map(o=>b(o===wish?`${esc(o)}で頑張れと背中を押す`:`${esc(o)}の道を勧める<small>${o==='就職'?'野球以外の進路（学力に応じた職業）':o==='MLB'?'海外挑戦':''} 成功率${Math.round(persuadeProb(p,wish,o)*100)}%</small>`,'gradChoose',{id:p.id,t:o},'optbtn'+(o===wish?' primary':''))).join('')}`;}
 else{body=`<div class="talk"><div class="who">${esc(p.name)}</div>${esc(gradTalk(p,wish))}</div><div class="talk me"><div class="who">${esc(G.coach.name)}監督</div>${dec.target===wish?'その道で頑張れ。応援している。':`${esc(dec.target)}の道も考えてみないか。`}</div><div class="talk"><div class="who">${esc(p.name)}</div>${esc(dec.reply)}</div><div class="ev"><span>決定：<b>${esc(dec.path)}</b>${dec.detail?'　'+esc(dec.detail):''}</span></div><div style="margin-top:10px">${b(gw.i+1>=th.length?'面談を終える':'次の選手へ','gradNext',{},'primary big')}</div>`;}
 openModal(`<h2>進路相談 <span class="muted small">${mode==='grad'?'卒業前・':''}${gw.i+1}／${th.length}人目</span></h2>${card}${body}`,true);}
ACT.gradChoose=d=>{const p=pById(d.id);if(!p)return;const gw=G.gradWish;const wish=gw.w[p.id];const target=d.t;const ok=R()<persuadeProb(p,wish,target);const path=ok?target:wish;const reply=gradReply(p,wish,target,ok);
 if(gw.mode==='grad'){const g=graduate(p,path);p.path=g.path;gw.decided[p.id]={target,ok,path:g.path,reply,detail:g.timeline[0]?g.timeline[0].t:''};}
 else{p.path=path;p.pathDetail=PATH_DETAIL[path]||'';gw.decided[p.id]={target,ok,path,reply,detail:p.pathDetail};if(path==='プロ'||path==='MLB')addNews('部内',`${p.name}が${path==='MLB'?'海外挑戦':'プロ志望'}を表明`,`${G.school.name}の${p.name}（${posName(p.pos)}）が${path==='MLB'?'メジャーリーグ挑戦':'プロ志望届の提出'}を明らかにした。${isPitcher(p)?'最速'+(p.maxVelo||Math.round(p.pit.velo))+'km/hの'+(p.throws==='左'?'左腕':'右腕'):'通算'+p.career.hr+'本塁打の強打者'}の動向にスカウトの注目が集まる。`,{imp:2,pid:p.id});}
 saveGame();showCareerModal(gw.mode);};
ACT.gradNext=()=>{G.gradWish.i++;saveGame();showCareerModal(G.gradWish.mode);};
function finishCareer(){const th=gradList();const out=th.map(p=>`<div class="notice"><b>${esc(p.name)}</b>：${esc(p.path||'未定')}${p.pathDetail?'　'+esc(p.pathDetail):''}</div>`);G.gradWish=null;if(G.queue[0]&&G.queue[0].type==='career')G.queue.shift();saveGame();
 openModal(`<h2>進路の希望が出そろった</h2>${out.join('')}<div class="hint">プロ志望・海外挑戦の選手は10月4週のドラフト会議で運命が決まります。卒業は3月。</div>${b('OK','closeQ',{},'primary big')}`,true);}

 const out=th.map(p=>{const g=G.graduates.find(x=>x.id===p.id);return `<div class="notice"><b>${esc(p.name)}</b>：${g?esc(g.path)+' '+esc(g.timeline[0]?g.timeline[0].t:''):'-'}</div>`;});

/* ================= フィールドプレイ演出（3/4俯瞰・カメラ追従） =================
 ワールド座標：X=一塁側が+（m）、Y=センター方向が+（m）、Z=高さ（m）。本塁が原点。
 シーンは時刻(ms)をキーにした各エンティティの経路で表し、毎フレーム補間して描く。 */
const FW_BASE=[[0,0],[19.4,19.4],[0,38.8],[-19.4,19.4],[0,0]];
const FW_SPEED=0.74; /* 実時間に対する演出の速さ（小さいほど速く進む） */
function fwPolar(d,a){const r=a*Math.PI/180;return [d*Math.sin(r),d*Math.cos(r)];}
function fwDist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
function fwLerp(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];}
function fwDefPos(d){const P={投:[0,18.4],捕:[0,-2.2],一:[19,21.9],二:[10.9,40.6],三:[-19,21.9],遊:[-10.9,40.6],左:[-38.6,75.7],中:[0,95],右:[38.6,75.7]};
 if(d&&d.infieldIn){P.一=[15.5,17.5];P.二=[8.5,31];P.三=[-15.5,17.5];P.遊=[-8.5,31];}
 if(d&&d.ofDeep){P.左=[-43,85];P.中=[0,106];P.右=[43,85];}if(d&&d.ofIn){P.左=[-33,64];P.中=[0,80];P.右=[33,64];}
 return P;}
/* 経路：[{t,x,y,z?}] を時刻で補間 */
function fwAt(path,t){if(!path||!path.length)return null;if(t<=path[0].t)return path[0];for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];if(t<=b.t){const u=b.t===a.t?1:(t-a.t)/(b.t-a.t);const z=(a.z||0)+((b.z||0)-(a.z||0))*u+(b.arc?b.arc*4*u*(1-u):0);return {x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,z,moving:true,seg:i};}}const l=path[path.length-1];return {x:l.x,y:l.y,z:l.z||0,moving:false,seg:path.length};}
function fwPathLen(path){let s=0;for(let i=1;i<path.length;i++)s+=fwDist([path[i-1].x,path[i-1].y],[path[i].x,path[i].y]);return s;}
/* 塁から塁への経路点（中間の塁を経由） */
function fwBasePath(from,to){const pts=[];for(let b=from;b<=to;b++)pts.push(FW_BASE[b]);return pts;}
/* 走者の経路を作る：t0から出発、速度v(m/s)。arrive指定なら到着時刻に合わせる */
function fwRunnerPath(from,to,t0,v,arriveAt,lead){const pts=fwBasePath(from,to);const start=lead?fwLerp(pts[0],pts[1]||pts[0],Math.min(0.12,lead/27.4)):pts[0];pts[0]=start;let len=0;for(let i=1;i<pts.length;i++)len+=fwDist(pts[i-1],pts[i]);
 let dur=len/v*1000*FW_SPEED;if(arriveAt!=null){dur=Math.max(250,arriveAt-t0);}
 const path=[{t:t0,x:pts[0][0],y:pts[0][1]}];let acc=0;for(let i=1;i<pts.length;i++){acc+=fwDist(pts[i-1],pts[i]);path.push({t:t0+dur*(len?acc/len:1),x:pts[i][0],y:pts[i][1]});}return path;}
/* ====== インプレーのシーン構築 ====== */
function fwBuildScene(c,play,opt){opt=opt||{};const m=AR.m;const d=m.def();const DP=fwDefPos(d);const S=FW_SPEED;
 const sc={t0:performance.now(),T:0,ball:[],fielders:{},runners:[],callouts:[],fx:[],pauseAt:null,kind:'inplay',res:c.res,primary:c.fpos,pois:[],ended:false};
 for(const k in DP)sc.fielders[k]={path:[{t:0,x:DP[k][0],y:DP[k][1]}],pose:[],face:k==='捕'?1:-1};
 const an=c.anim=c.anim||{roll:rf(0.5,1),bob:rf(0,1),ang:gauss(0,1)};
 const a=c.a||0;const dist=Math.max(4,c.dist||10);const type=c.type;const air=type==='fly'||type==='line'||type==='pop';const caught=c.res==='FO'||c.res==='LO'||c.res==='PO';
 const launch=[0,0.6,1.0];
 let Tland,Tcatch,pick=null,Tpick=null,land;
 const isHR=c.res==='HR';
 if(air){const land0=fwPolar(dist,a);land=land0;const Th=(type==='fly'?1.5+dist/75:type==='line'?0.65+dist/110:2.0+dist/90)*1000*S;const hmax=type==='fly'?10+dist/5:type==='line'?2.5+dist/30:16+dist/5;
  sc.ball.push({t:0,x:0,y:0,z:1});sc.ball.push({t:Th,x:land[0],y:land[1],z:isHR?2.5:0,arc:hmax});Tland=Th;
  if(caught){Tcatch=Th*0.93;const p=fwAt(sc.ball,Tcatch);pick=[p.x,p.y];Tpick=Tcatch;sc.ball.splice(1,1,{t:Tcatch,x:p.x,y:p.y,z:1.5,arc:hmax*0.93});}
  else if(isHR){const fd=FENCE(a);const extra=fwPolar(Math.max(dist,fd+6),a);sc.ball[1]={t:Th,x:extra[0],y:extra[1],z:3,arc:hmax};land=extra;Tland=Th;}
  else{/* 落ちてから転がる */const roll=fwPolar(dist+4+an.roll*8,a);sc.ball.push({t:Th+(380+an.roll*300)*S,x:roll[0],y:roll[1],z:0,arc:1.2});land=roll;Tland=sc.ball[sc.ball.length-1].t;}}
 else{/* ゴロ・バント：減速しながら転がる */const v0=c.bunt?clamp(dist*0.8,5,12):clamp((c.ev||100)*0.3,14,38);const dec=v0*v0/(2*dist);const end=fwPolar(dist,a);const Tstop=(v0/dec)*1000*S;
  sc.ball.push({t:0,x:0,y:0,z:0.3});const n=5;for(let i=1;i<=n;i++){const tt=(v0/dec)*i/n;const s=v0*tt-0.5*dec*tt*tt;const p=fwPolar(s,a);sc.ball.push({t:tt*1000*S,x:p[0],y:p[1],z:i<3?0.25:0.05});}
  land=end;Tland=Tstop;}
 /* 捕球する野手を決める */
 let fielder=c.fpos;const ofByAng=a<-15?'左':a<=15?'中':'右';const isHit=['1B','2B','3B'].includes(c.res);
 const infield=['投','捕','一','二','三','遊'].includes(fielder);
 const fp=sc.fielders;
 const runTo=(k,pt,arrive,t0)=>{const f=fp[k];const st=f.path[f.path.length-1];const dd=fwDist([st.x,st.y],pt);const v=7.6;let dur=dd/v*1000*S;if(arrive!=null){dur=Math.max(120,arrive-(t0||st.t));}f.path.push({t:(t0||st.t)+dur,x:pt[0],y:pt[1]});return (t0||st.t)+dur;};
 if(caught){/* 捕球点へ走り込む */runTo(fielder,pick,Tcatch);fp[fielder].pose.push({t:Tcatch-150*S,p:type==='pop'||type==='fly'?'catchHigh':'catchLow'});fp[fielder].pose.push({t:Tcatch+400*S,p:'throw'});sc.callouts.push({t:Tcatch,x:pick[0],y:pick[1],z:2,text:'キャッチ！',kind:'catch'});Tpick=Tcatch;}
 else if(isHR){const fd=FENCE(a);const fence=fwPolar(fd-2,a);runTo(fielder,fence,Tland*0.9);fp[fielder].pose.push({t:Tland*0.5,p:'lookUp'});const cross=Tland*(fd/Math.max(dist,fd+6));sc.callouts.push({t:cross+100,x:land[0],y:land[1],z:4,text:'ホームラン！！',kind:'hr',dur:1800});sc.fx.push({t:cross,x:land[0],y:land[1],kind:'fireworks'});Tpick=Tland+600;}
 else if(!air){/* ゴロ：捕球地点＝野手が追いつける最初の点 */const f0=DP[fielder];let best=null;for(let i=1;i<sc.ball.length;i++){const bp=sc.ball[i];const need=fwDist(f0,[bp.x,bp.y])/7.6*1000*S;if(need<=bp.t+60){best=bp;break;}}
  if(c.res==='E'){const bp=best||sc.ball[Math.min(2,sc.ball.length-1)];runTo(fielder,[bp.x,bp.y],bp.t);fp[fielder].pose.push({t:bp.t-100,p:'catchLow'});/* はじく */const off=fwPolar(4+an.bob*4,a+(an.ang>0?35:-35));sc.ball.splice(sc.ball.findIndex(x=>x.t>=bp.t)+1);sc.ball.push({t:bp.t+500*S,x:bp.x+off[0],y:bp.y+off[1],z:0,arc:1});sc.callouts.push({t:bp.t+80,x:bp.x,y:bp.y,z:2,text:'エラー！',kind:'err'});pick=[bp.x+off[0],bp.y+off[1]];Tpick=runTo(fielder,pick,null,bp.t+350*S)+150;fp[fielder].pose.push({t:Tpick,p:'throw'});land=pick;}
  else if(isHit&&infield){/* 内野を抜ける：内野手は届かず、外野手が拾う */const near=fwPolar(Math.min(dist*0.55,30),a);runTo(fielder,[near[0]+(an.ang>0?2:-2),near[1]],null);fp[fielder].pose.push({t:fwAt(sc.ball,0).t+300,p:'dive'});const of=ofByAng;const stop=sc.ball[sc.ball.length-1];const dd=fwDist(DP[of],[stop.x,stop.y]);let Tm=Math.max(stop.t*0.8,dd/8.5*1000*S);pick=[stop.x,stop.y];Tpick=runTo(of,pick,Tm);fp[of].pose.push({t:Tpick-120,p:'catchLow'});fp[of].pose.push({t:Tpick+300*S,p:'throw'});fielder=of;Tpick+=200*S;}
  else{const bp=best||sc.ball[sc.ball.length-1];pick=[bp.x,bp.y];runTo(fielder,pick,bp.t);fp[fielder].pose.push({t:bp.t-120,p:'catchLow'});Tpick=bp.t+(c.bunt?350:260)*S;fp[fielder].pose.push({t:Tpick-80,p:'throw'});sc.ball.splice(sc.ball.findIndex(x=>x.t>=bp.t)+1);}}
 else{/* 外野／内野に落ちるヒット（またはエラー） */const stop=sc.ball[sc.ball.length-1];pick=[stop.x,stop.y];const who=c.res==='E'?fielder:(dist<45?fielder:(['左','中','右'].includes(fielder)?fielder:ofByAng));fielder=who;
  const dd=fwDist(DP[who],pick);const Tm=Math.max(Tland*0.9,dd/8.5*1000*S);Tpick=runTo(who,pick,Tm)+220*S;fp[who].pose.push({t:Tpick-200*S,p:'catchLow'});fp[who].pose.push({t:Tpick,p:'throw'});
  if(c.res==='E'){sc.callouts.push({t:Tpick-100,x:pick[0],y:pick[1],z:2,text:'エラー！',kind:'err'});Tpick+=500*S;}
  /* 落下点に野手が届かず：ポーズ */if(dist>=45&&!isHR)fp[who].pose.push({t:Tland*0.5,p:'run'});}
 sc.primary=fielder;sc.Tpick=Tpick;sc.pick=pick||land;
 /* ====== 走者と送球 ====== */
 const t=m.bat();const cb=arTeamColors(t);const cd=arTeamColors(d);sc.colBat=cb;sc.colDef=cd;
 const pend=!play;const vOf=sp=>6.6+(sp-50)/22;

  el.innerHTML=`<div class="row"><b class="small">${ph==='field'||ph==='decide'?'プレー中…':ph==='flight'||ph==='wind'?'最終球をリプレイ中…':(r&&r.ev&&(r.ev.text||arKindText(r.ev)))||'結果'}</b><span class="tiny muted">タップでスキップ</span></div>${r?`<div class="tiny" style="margin:2px 0 4px">${esc(cdInfoText(r))}</div>`:''}${seqHtml}`;return;}
 const side=cdSide();const hand=CD.hand[side];const t=m.bat(),d=m.def();const bt=t.lineup[t.batIdx].p,pt=d.pitcher;const who=side==='off'?bt:pt;

 let extra='';
 if(side==='off'){const B=m.bases;extra=`${t.bench.some(x=>!isPitcher(x))?b('代打','arPinchList',{},'sm'):''}${B.some(Boolean)&&t.bench.length?b('代走','arPinchRunList',{},'sm'):''}`;}
 else{const B=m.bases;extra=`${b(d.infieldIn?'前進守備 ✓':'前進守備','arShift',{k:'in'},'sm '+(d.infieldIn?'primary':''))}${b(d.ofDeep?'外野深め ✓':'外野深め','arShift',{k:'deep'},'sm '+(d.ofDeep?'primary':''))}${b(d.ofIn?'外野前進 ✓':'外野前進','arShift',{k:'ofin'},'sm '+(d.ofIn?'primary':''))}${b(d.buntAlert?'バント警戒 ✓':'バント警戒','cdAlert',{k:'bunt'},'sm '+(d.buntAlert?'primary':''))}${b(d.stealAlert?'盗塁警戒 ✓':'盗塁警戒','cdAlert',{k:'steal'},'sm '+(d.stealAlert?'primary':''))}${(B[1]&&!B[0])||(B[2]&&!B[0])?b('敬遠','cdIbb',{},'sm'):''}${d.bench.some(x=>isPitcher(x)||x.sub.includes('投'))?b('投手交代','arChangeList',{},'sm'):''}`;}

 return `<div id="uniPreview">${uniformPreview(u,e,{w:120,number:1})}</div>
 <div class="grid2" style="margin-top:10px">
 ${colorField('ユニフォーム基本色','base',u.base,'u')}${colorField('差し色（襟・ライン）','trim',u.trim,'u')}
 <label class="f">デザイン<select data-inp="uni" data-scope="u" data-k="style">${UNI_STYLES.map(s=>`<option value="${s.id}"${u.style===s.id?' selected':''}>${s.name}</option>`).join('')}</select></label>

 ${colorField('背番号の色','numColor',u.numColor,'u')}${colorField('背番号の縁取り','numOutline',u.numOutline,'u')}
 ${colorField('帽子の色','cap',u.cap,'u')}${colorField('つばの色','capBrim',u.capBrim,'u')}
 </div><div class="sep"></div><b>校章</b><div class="grid2" style="margin-top:6px">
 <label class="f">形<select data-inp="uni" data-scope="e" data-k="shape">${EMBLEM_SHAPES.map(s=>`<option value="${s.id}"${e.shape===s.id?' selected':''}>${s.name}</option>`).join('')}</select></label>
 <label class="f">校章の文字（1〜3文字）<input type="text" maxlength="3" value="${esc(e.text)}" data-inp="uni" data-scope="e" data-k="text"></label>
 <label class="f">文字フォント<select data-inp="uni" data-scope="e" data-k="textFont">${fontOpts(e.textFont)}</select></label>
 ${colorField('文字の色','textColor',e.textColor,'e')}${colorField('地の色','bg',e.bg,'e')}${colorField('縁の色','border',e.border,'e')}
 <label class="f"><span class="row" style="justify-content:flex-start;gap:6px"><input type="checkbox" ${e.ring?'checked':''} data-inp="uni" data-scope="e" data-k="ring" style="width:18px;height:18px">内側の輪郭線を入れる</span></label>${colorField('輪郭線の色','ringColor',e.ringColor,'e')}
 </div>`;}

INP.uni=(d,el)=>{const dr=uniDraft();if(!dr)return;const t=d.scope==='u'?dr.u:dr.e;t[d.k]=el.type==='checkbox'?el.checked:el.value;const pv=$('#uniPreview');if(pv)pv.innerHTML=uniformPreview(dr.u,dr.e,{w:120,number:1});};

 <label class="f">初期設備<select id="cuFac">${['なし','基本セット（ブルペン・マシン・ウエイト・救護室）','充実セット（室内練習場・食堂など9種）','全設備（約50種）を最上級で導入'].map((n,i)=>`<option value="${i}"${st.custom.facLevel===i?' selected':''}>${n}</option>`).join('')}</select></label>

/* ================= 起動 ================= */
function boot(data){data=data||{};if(data.save){try{G=JSON.parse(data.save);migrate();}catch(e){G=null;}}
 if(!G&&hasSave()){loadGame();}
 const hot=window.claude&&window.claude.hot;if(hot&&hot.snapshot){try{hot.snapshot(()=>({save:G?serialize():null}));}catch(e){}}
 render();}
(function(){const hot=window.claude&&window.claude.hot;if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});})();
