<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="高校野球">
<meta name="theme-color" content="#1e6b43">
<title>高校野球シミュレーション</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Antique&family=Oswald:wght@500;700&family=Anton&family=Bebas+Neue&family=Graduate&family=Rye&family=Alfa+Slab+One&family=Black+Ops+One&family=Permanent+Marker&family=Bungee&family=Russo+One&family=Dela+Gothic+One&family=Reggae+One&family=Yuji+Syuku&family=Kaisei+Decol&family=RocknRoll+One&family=Shippori+Mincho:wght@700&family=Rampart+One&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* layout: sticky scoreboard header, scrolling content, fixed bottom tab bar; one-column phone-first */
:root{
 --bg:#f3f0e7; --panel:#fffdf8; --ink:#1c2229; --muted:#66707a; --line:#d9d4c6;
 --accent:#1e6b43; --accent-ink:#ffffff; --accent2:#b4562b; --gold:#c0901a;
 --soft:#e4efe8; --warn:#fbf0d2; --danger:#b3261e; --tab:#fffdf8; --shadow:0 1px 2px rgba(28,34,41,.08);
 --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
 --font-display:"Zen Antique","Hiragino Mincho ProN","Noto Serif JP",serif;
 --font-num:"Oswald","Helvetica Neue",Arial,sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#11161a; --panel:#1a2127; --ink:#e9e6dd; --muted:#9aa5ae; --line:#2b353d; --accent:#3fa36b; --accent-ink:#0d1a12; --accent2:#e07a4a; --gold:#e0b347; --soft:#1b2e24; --warn:#3a3118; --danger:#ff6b61; --tab:#151b20; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#11161a; --panel:#1a2127; --ink:#e9e6dd; --muted:#9aa5ae; --line:#2b353d; --accent:#3fa36b; --accent-ink:#0d1a12; --accent2:#e07a4a; --gold:#e0b347; --soft:#1b2e24; --warn:#3a3118; --danger:#ff6b61; --tab:#151b20; --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
a{color:var(--accent)}
[hidden]{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--accent);color:#fff;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .ttl{display:flex;align-items:center;gap:8px;min-width:0}
.top .school{font-family:var(--font-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:12px;text-align:right;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums}
.top .meta b{font-family:var(--font-num);font-size:14px;letter-spacing:.02em}
main{padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;min-width:0}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--tab);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;border:0;background:none;padding:7px 2px 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.tabs button .ic{font-size:18px;line-height:1.2}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.hd{font-family:var(--font-display);font-size:20px;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.row>*{min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.col{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.grid2.stats{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.big{width:100%;padding:13px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--soft);color:var(--accent);font-weight:700;white-space:nowrap}
.badge.gold{background:var(--warn);color:var(--gold)}
.badge.red{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.badge.gray{background:transparent;color:var(--muted);border:1px solid var(--line)}
.rk{display:inline-block;min-width:1.5em;text-align:center;font-weight:700;font-family:var(--font-num);font-size:13px}
.rk-S{color:#d4a017}.rk-A{color:#d2452f}.rk-B{color:#e07a2a}.rk-C{color:#2f8a4f}.rk-D{color:#3673b8}.rk-E{color:#7c6fc4}.rk-F{color:var(--muted)}.rk-G{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.right{text-align:right}
.center{text-align:center}
.money{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.neg{color:var(--danger)}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:4px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.t th{color:var(--muted);font-weight:700;font-size:11px}
table.t td.l,table.t th.l{text-align:left}
table.t tr.hl td{background:var(--soft)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--gold)}
.bar i.bad{background:var(--danger)}
.list{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.pl .nm{font-weight:700;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .no{font-family:var(--font-num);font-size:16px;text-align:center;color:var(--muted)}
.pl .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl select{max-width:112px;font-size:12px;padding:4px;border-radius:7px;border:1px solid var(--line);background:var(--panel)}
.pl.inj{border-color:var(--danger)}
.pl.ret{opacity:.65}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel);max-width:100%}
input[type=color]{flex:0 0 40px;width:40px;height:32px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
input[type=range]{width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f>*{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);width:100%;max-width:760px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:16px 16px 0 0;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.modal h2{font-family:var(--font-display);font-size:19px;margin-bottom:10px}
.modal .x{position:sticky;top:0;float:right;margin:-4px -4px 0 0}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:80;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.notice{font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.notice .t{color:var(--muted);margin-right:6px;font-size:11px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv b{font-weight:400;color:var(--muted);white-space:nowrap}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;align-items:center}
.stat span:nth-child(2n){text-align:right;font-family:var(--font-num)}
.ab{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;margin:2px 2px 0 0;border:1px solid var(--line)}
.ab.u{background:var(--warn);color:var(--gold);border-color:var(--gold);font-weight:700}
.ab.neg{color:var(--danger);border-color:var(--danger)}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.ls{overflow-x:auto}
.ls table{border-collapse:collapse;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12px;width:100%}
.ls th,.ls td{padding:2px 5px;text-align:center;border-bottom:1px solid var(--line);min-width:18px}
.ls td.tn,.ls th.tn{text-align:left;font-family:var(--font-body);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls td.tot{font-weight:700;font-size:14px}
.sit{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px;background:var(--soft);border-radius:10px;margin:6px 0}
.diamond{width:54px;height:54px;position:relative}
.diamond i{position:absolute;width:14px;height:14px;background:var(--line);transform:rotate(45deg);border:1px solid var(--muted)}
.diamond i.on{background:var(--accent2)}
.diamond i.b1{right:4px;top:20px}.diamond i.b2{left:20px;top:4px}.diamond i.b3{left:4px;top:20px}
.outs{display:flex;gap:4px;margin-top:3px}
.outs i{width:10px;height:10px;border-radius:50%;border:1px solid var(--muted);display:block}
.outs i.on{background:var(--danger);border-color:var(--danger)}
.log{font-size:12px;max-height:38vh;overflow:auto;background:var(--bg);padding:8px;border-radius:8px;line-height:1.5}
.log .inn{font-weight:700;color:var(--accent);margin-top:6px}
.log .hit,.log .run{color:var(--accent2);font-weight:700}
.log .hr{color:var(--danger);font-weight:700}
.log .k{color:var(--muted)}
.log .sub,.log .note{color:var(--gold)}
.log .end{font-weight:700;margin-top:6px}
.dec{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rnd{margin-bottom:10px}
.rname{font-weight:700;font-size:13px;color:var(--accent);margin-bottom:4px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;font-size:12px;padding:3px 6px;border-bottom:1px solid var(--line);align-items:center}
.mt span:first-child{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .sc{font-family:var(--font-num);min-width:44px;text-align:center;color:var(--muted)}
.mt.ours{background:var(--soft);border-radius:6px}
.mt .win{font-weight:700;color:var(--ink)}
.mt span:not(.win):not(.sc){color:var(--muted)}
.byes{font-size:11px;color:var(--muted);padding:2px 6px}
.champ{font-weight:700;padding:8px;background:var(--warn);border-radius:8px;margin-top:6px}
.mood{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mood i{display:block;height:100%;background:linear-gradient(90deg,var(--danger),var(--gold),var(--accent))}
.cand{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--panel)}
.cand.signed{border-color:var(--accent);background:var(--soft)}
.cand.lost{opacity:.5}
.dm{font-size:11px;display:inline-block;margin:1px 4px 1px 0}
.dm.ok{color:var(--accent)}.dm.ng{color:var(--danger)}
.news{border-bottom:1px solid var(--line);padding:8px 0}
.news h4{font-size:14px;margin-bottom:2px}
.news .cat{font-size:11px;color:var(--accent2);font-weight:700;margin-right:6px}
.news p{margin:3px 0 0;font-size:13px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--font-display)}
.paper .mast{font-size:22px;text-align:center;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:8px}
.subtabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
.subtabs button{flex:0 0 auto}
.subtabs .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.uni-prev{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.uni-prev svg{max-width:100%;height:auto}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.swatches button{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer}
.setup{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup .hero{text-align:center;margin-bottom:14px}
.setup .hero h1{font-family:var(--font-display);font-size:28px;letter-spacing:.04em}
.setup .hero p{color:var(--muted);margin:4px 0 0;font-size:13px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.steps b{color:var(--accent)}
.timeline{font-size:12px;padding-left:14px;border-left:2px solid var(--line);margin:4px 0 0 4px}
.timeline div{margin-bottom:3px}
.timeline .y{color:var(--muted);margin-right:6px;font-family:var(--font-num)}
.ev{padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.ev.warn{background:var(--warn)}
.pitchtbl td:first-child{text-align:left;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sep{height:1px;background:var(--line);margin:8px 0}
.boxs{font-size:12px}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.lineup-row{display:grid;grid-template-columns:24px 64px 1fr;gap:6px;align-items:center;margin-bottom:5px}
.lineup-row select{width:100%;padding:5px;font-size:12px}
.err{color:var(--danger);font-size:12px;margin:4px 0}
.ok{color:var(--accent);font-size:12px;margin:4px 0}
.check{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px}
.optbtn{display:block;width:100%;text-align:left;margin-bottom:6px;white-space:normal}
.optbtn small{display:block;color:var(--muted);font-weight:400}
.ribbon{font-family:var(--font-display);font-size:18px;text-align:center;padding:8px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);margin:8px 0}
.abrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:4px 0;border-bottom:1px dashed var(--line)}
.abrow .ab{margin:0;white-space:nowrap}

/* 新聞紙面 */
.pnav{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:6px 0}
.pno{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.paper2{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;font-family:var(--font-display);color:var(--ink);box-shadow:var(--shadow)}
.paper2 .mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:10px;gap:8px}
.paper2 .mast-l{font-size:24px;letter-spacing:.06em;font-weight:700}
.paper2 .mast-r{font-size:11px;text-align:right;color:var(--muted);line-height:1.3}
.paper2 article{cursor:pointer}
.paper2 .lead{display:grid;grid-template-columns:120px 1fr;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.paper2 .lead-photo .avatar{display:block;border:1px solid var(--ink)}
.paper2 .cap{font-size:10px;color:var(--muted);margin-top:3px;font-family:var(--font-body)}
.paper2 .lead h2{font-size:22px;line-height:1.25;margin:2px 0 6px;font-weight:700}
.paper2 .cat{font-family:var(--font-body);font-size:10px;font-weight:700;color:var(--accent2);border:1px solid var(--accent2);padding:0 5px;border-radius:2px}
.paper2 .body{font-family:var(--font-body);font-size:13px;line-height:1.7;margin:0;text-align:justify}
.paper2 .secs{display:grid;grid-template-columns:1fr;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
@media (min-width:560px){.paper2 .secs{grid-template-columns:1fr 1fr 1fr}.paper2 .body{column-count:2;column-gap:14px}}
.paper2 .sec{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.paper2 .sec-photo .avatar{border:1px solid var(--ink);display:block}
.paper2 .sec h3{font-size:15px;line-height:1.3;margin:2px 0 4px}
.paper2 .sec p{font-family:var(--font-body);font-size:12px;line-height:1.6;margin:0;color:var(--ink)}
.paper2 .briefs .bh{font-size:12px;font-weight:700;border-bottom:1px solid var(--ink);margin-bottom:4px}
.paper2 .brief{font-family:var(--font-body);font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.paper2 .brief .cat{margin-right:6px}
.paper2 .foot{font-family:var(--font-body);font-size:10px;color:var(--muted);text-align:center;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.paper2.single .lead{grid-template-columns:1fr;border-bottom:0}
.paper2.single .lead-photo{text-align:center}
.paper2.single .lead-photo .avatar{display:inline-block}
@media (max-width:420px){.paper2 .lead{grid-template-columns:96px 1fr}.paper2 .lead-photo .avatar{width:96px;height:96px}.paper2 .lead h2{font-size:18px}}
/* トーナメント表 */
.bracket{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:70vh}
.bracket svg{display:block}
/* 進路面談 */
.talk{background:var(--soft);border-radius:12px;padding:10px;margin:8px 0;font-size:13px;line-height:1.6;position:relative}
.talk::before{content:"";position:absolute;left:18px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--soft)}
.talk .who{font-size:11px;color:var(--muted);margin-bottom:2px}
.talk.me{background:var(--warn)}
.talk.me::before{border-bottom-color:var(--warn)}

/* ドラフト会議 */
.draft{background:#0f1b2d;color:#f1f3f6;border-radius:12px;padding:14px;font-family:var(--font-body)}

.draft .dpick{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;background:rgba(255,255,255,.06);border-radius:6px;font-size:13px}

.draft .dpick .dname{font-weight:700}
.draft .dpick .dinfo{font-size:11px;color:#b9c3d0;white-space:nowrap}
.draft .dpick.ours{background:#e0b347;color:#1a1a1a;box-shadow:0 0 0 2px #fff inset}
.draft .dpick.ours .dteam,.draft .dpick.ours .dinfo{color:#1a1a1a}
.draft .dpick.reveal{animation:dreveal .5s ease-out}
@keyframes dreveal{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.draft .dpick.reveal{animation:none}}
.draft .dlot{margin-top:10px;padding:8px;background:#7a1f1f;border-radius:8px;text-align:center;font-weight:700}
.draft .dlotteams{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.draft .dball{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px}
.draft .dball.win{background:#e0b347;color:#1a1a1a;font-weight:700;box-shadow:0 0 12px #e0b347}
.draft .dwin{text-align:center;font-size:18px;margin-top:6px;color:#fff}
.draft .ok{color:#8fe3a6}.draft .err{color:#ff8f86}
.draft .muted{color:#b9c3d0}
/* 記者会見 */
.press{position:relative;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.press .pback{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px;font-family:var(--font-display);font-size:11px;color:var(--muted);opacity:.5;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,var(--panel) 10px,var(--panel) 20px);justify-content:center}
.press .pstage{text-align:center;padding:10px;background:var(--bg)}
.press .pstage .avatar{border:2px solid var(--ink);display:inline-block}
.press .pname{font-family:var(--font-display);font-size:18px;margin-top:6px}
.press .ptag{display:inline-block;background:#0f1b2d;color:#fff;font-size:12px;padding:3px 10px;border-radius:4px;margin-top:4px}
.press .pqa{padding:8px}

/* オーダー編集 */
.lrow{display:grid;grid-template-columns:22px 52px 1fr auto;gap:6px;align-items:center;padding:4px 4px;border:1px solid var(--line);border-radius:9px;margin-bottom:4px;background:var(--panel)}

.lrow .lname{cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 2px}
.lrow .larrows{display:flex;gap:2px}
.lrow .larrows .btn{padding:3px 6px;font-size:11px}
.bpl{white-space:normal;text-align:left}
/* 選手エディット */
.pitchrow{display:grid;grid-template-columns:1fr 56px 48px 48px 48px auto;gap:4px;align-items:center;margin-bottom:4px}
.pitchrow input,.pitchrow select{padding:4px;font-size:12px;min-width:0;width:100%}
.abgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;padding:4px 0}
.abchk{font-size:12px;display:flex;align-items:center;gap:4px}

/* ===== 操作モード（アリーナ） ===== */
.arena{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.ar-top .sbt i{width:5px;height:14px;border-radius:2px;border-left:2px solid;flex:0 0 auto}

.ar-cnt i.on.b{background:#3fd36b;border-color:#3fd36b}.ar-cnt i.on.s{background:#ffd166;border-color:#ffd166}.ar-cnt i.on.o{background:#ff5a4a;border-color:#ff5a4a}

/* 本塁打ボード */

.hrb .hrt{font-family:var(--font-display);font-size:40px;letter-spacing:.08em;color:#ffd166;text-shadow:0 2px 0 #7a4a00,0 0 18px rgba(255,209,102,.7);line-height:1.05}

/* ハーフイニングのボード（ラインスコア） */
.ar-board{margin-top:3%;width:min(94%,420px);background:rgba(8,14,20,.82);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px 8px;color:#fff;text-align:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:ovpop .3s ease-out}

.ar-board .ls th{font-weight:400;color:#9fb3c8;font-size:10px;padding:1px 0;border-bottom:1px solid rgba(255,255,255,.15)}

.ar-vel{position:absolute;right:8px;top:30px;background:rgba(8,14,20,.8);border:1px solid rgba(255,255,255,.2);border-left:3px solid #ffd166;border-radius:6px;padding:4px 10px 4px 8px;color:#fff;display:flex;flex-direction:column;align-items:flex-end;line-height:1;opacity:0;transform:translateX(20px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:2}

.ar-vel small{font-size:9px;color:#cfd8e3;margin-top:1px}
.ar-vel span{font-size:11px;margin-top:3px;font-weight:700}
.ar-vel em{font-style:normal;font-size:10px;color:#ffd166;margin-top:3px}
.ar-pci{position:absolute;left:50%;top:31%;transform:translate(-50%,0) scale(.6);background:rgba(8,14,20,.78);border:2px solid #fff;border-radius:999px;padding:4px 14px;color:#fff;text-align:center;line-height:1.1;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;z-index:2;white-space:nowrap}
.ar-pci.show{opacity:1;transform:translate(-50%,0) scale(1)}
.ar-pci b{font-family:var(--font-display);font-size:18px;letter-spacing:.08em;display:block}
.ar-pci span{font-size:10px;color:#e8edf2}
.ar-pci.perfect{border-color:#ffd166;color:#ffd166;box-shadow:0 0 14px rgba(255,209,102,.6)}
.ar-pci.good{border-color:#7ef0a0;color:#7ef0a0}
.ar-pci.ok{border-color:#cfd8e3}
.ar-pci.miss{border-color:#ff6b61;color:#ff6b61}
.ar-lt{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:2;opacity:0;transform:translateY(14px);transition:opacity .25s,transform .25s}
.ar-lt.show{opacity:1;transform:none}
.ar-lt .ltc{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(8,14,20,.92),rgba(8,14,20,.78));border-left:4px solid var(--tc,#fff);border-radius:4px;padding:4px 8px 4px 6px;color:#fff;min-height:36px}
.ar-lt .ltc.pit{align-self:flex-end;width:88%;min-height:30px;opacity:.95}
.ar-lt .num{font-family:var(--font-num);font-weight:700;font-size:16px;width:30px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:2px solid;flex:0 0 auto}
.ar-lt .ltc.pit .num{width:26px;height:24px;font-size:13px}
.ar-lt .nm{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;line-height:1.15}
.ar-lt .nm b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-lt .ltc.pit .nm b{font-size:12px}
.ar-lt .nm small{font-size:10px;color:#cfd8e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-lt .rt{display:flex;gap:4px;font-size:10px;flex:0 0 auto}
.ar-lt .rt span{display:flex;align-items:center;gap:1px}
.ar-rep{position:absolute;left:10px;top:9%;color:#fff;font-family:var(--font-display);font-size:14px;letter-spacing:.2em;display:flex;align-items:center;gap:6px;z-index:2;pointer-events:none}
.ar-rep::before{content:'';width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:blink 1s steps(2) infinite}

.ar-gauge{position:absolute;right:10px;top:10%;bottom:16%;width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;cursor:pointer;z-index:3}
.ar-gauge .gbar{flex:1;width:22px;border-radius:11px;background:linear-gradient(#ff5a4a,#ffd166 35%,#3fd36b 46%,#3fd36b 54%,#ffd166 65%,#ff5a4a);position:relative;border:2px solid #fff}
.ar-gauge.simple .gbar b{position:absolute;left:-6px;right:-6px;top:50%;height:2px;background:#fff;margin-top:-1px}

.ar-gauge:not(.simple) .gbar{background:linear-gradient(180deg,#ff5a4a 0 13%,#ffd166 13% 32%,#4f88c9 32% 77%,#3fd36b 77% 88%,#4f88c9 88% 100%)}
.ar-gauge:not(.simple) .gbar b{position:absolute;left:-6px;right:-6px;height:2px;background:#fff;margin-top:-1px;box-shadow:0 0 4px #3fd36b}

.dec.thr{display:flex;gap:6px;flex-wrap:nowrap}

.ar-ctl.card{height:196px}

/* 能力値の集計 */
function abilAcc(p,ctx){const acc={};const list=p.unique.concat(p.abilities);for(const a of list){const d=ABIL[a];if(!d||!d.f)continue;for(const blk of d.f){if(blk.chance!=null&&Math.random()>blk.chance)continue;const w=blk.when?(Array.isArray(blk.when)?blk.when:[blk.when]):[];let ok=true;for(const c of w){if(!ctx[c]){ok=false;break;}}if(!ok)continue;for(const k in blk){if(k==='when'||k==='chance')continue;const v=blk[k];if(MULT_KEYS.includes(k))acc[k]=(acc[k]==null?1:acc[k])*v;else acc[k]=(acc[k]||0)+(v===true?1:v);}}}return acc;}
function abilStatic(p,key){let v=null;for(const a of p.unique.concat(p.abilities)){const d=ABIL[a];if(!d||!d.f)continue;for(const blk of d.f){if(blk.when||blk.chance!=null)continue;if(blk[key]==null)continue;if(MULT_KEYS.includes(key))v=(v==null?1:v)*blk[key];else v=(v||0)+blk[key];}}return v==null?(MULT_KEYS.includes(key)?1:0):v;}

function abilReqOk(p,a){const d=ABIL[a];if(!d||!d.req)return true;const r=d.req;if(r.pow!=null&&(p.bat.powR+p.bat.powL)/2<r.pow)return false;if(r.meet!=null&&(p.bat.meetR+p.bat.meetL)/2<r.meet)return false;if(r.speed!=null&&p.bat.speed<r.speed)return false;if(r.steal!=null&&p.bat.steal<r.steal)return false;if(r.bunt!=null&&p.bat.bunt<r.bunt)return false;if(r.arm!=null&&p.bat.arm<r.arm)return false;if(r.velo!=null&&p.pit.velo<r.velo)return false;if(r.sharp!=null&&avg(p.pit.pitches.map(x=>x.sharp))<r.sharp)return false;if(r.pitches!=null&&p.pit.pitches.length<r.pitches)return false;return true;}

function batRating(p){const b=p.bat;return b.meetR*0.2+b.meetL*0.12+b.powR*0.17+b.powL*0.1+b.eye*0.08+b.speed*0.1+b.field*0.1+b.arm*0.05+b.thr*0.04+b.clutch*0.04;}

function gradeMult(p){const t={早熟:[1.35,1.0,0.7],普通:[1.0,1.1,1.0],晩成:[0.7,1.0,1.4]}[p.growth]||[1,1,1];return t[p.grade-1]||1;}
function bodyMult(p,k){if(['powR','powL','arm'].includes(k))return 1+(p.weight-70)/220;if(['speed','steal'].includes(k))return 1-(p.weight-70)/320;if(k==='velo')return 1+(p.height-172)/160;return 1;}
function grow(p,g,k,amt){const cap=p.caps[g+k]||100;const cur=p[g][k];if(cur>=cap)return 0;const near=(cap-cur)<10?0.5:1;const add=amt*near*rf(0.6,1.4)*bodyMult(p,k);p[g][k]=Math.min(cap,cur+add);return add;}
function growPitch(p,k,amt){const cap=p.caps.pitch||100;const n=p.pit.pitches.length?ri(1,Math.min(2,p.pit.pitches.length)):0;const sel=shuffle(p.pit.pitches).slice(0,n);for(const pt of sel){if(pt[k]>=cap)continue;pt[k]=Math.min(cap,pt[k]+amt*rf(0.6,1.4)*(cap-pt[k]<10?0.5:1));}}
function growVelo(p,amt){const cap=p.caps.velo||150;if(p.pit.velo>=cap)return;p.pit.velo=Math.min(cap,p.pit.velo+amt*rf(0.5,1.5)*bodyMult(p,'velo'));p.pit.pitches[0].velo=Math.round(p.pit.velo);}
function dormRec(){return DORM_LV[G.dorm.lv].rec+catSum('rest')+(alumniEff('fatigue')?3:0)+(G.coach.style==='温厚'?2:0)-(G.coach.style==='熱血'?2:0);}
function isMentoring(p){return G.players.some(x=>x.mentor&&x.mentor.seniorId===p.id);}
function canTrain(key,p){const m=TRAIN[key];if(!m)return false;if(m.lv>G.coach.level)return false;if(m.pOnly&&!(isPitcher(p)||(p.posChange&&p.posChange.to==='投')))return false;if(m.catReq&&!hasCat(m.cat))return false;return true;}
function trainPlayer(p){
 p.weeks++;
 if(p.retired){p.fatigue=Math.max(0,p.fatigue-15);return;}
 if(p.injury>0){p.injury--;p.fatigue=Math.max(0,p.fatigue-12);if(p.injury===0)notice(`${p.name}がケガから復帰した。`);return;}
 if(isMentoring(p)){p.fatigue=clamp(p.fatigue+4-dormRec(),0,100);return;}
 if(p.mentor){mentorWeek(p);return;}
 if(p.posChange){posChangeWeek(p);return;}
 if(p.training==='rest'||!TRAIN[p.training]){p.fatigue=Math.max(0,p.fatigue-(30+dormRec())*abilStatic(p,'recRest'));return;}
 if(!canTrain(p.training,p))p.training=isPitcher(p)?'pitch':'bat';
 const m=TRAIN[p.training];
 const fatPen=p.fatigue>75?0.45:p.fatigue>55?0.8:1;
 const meta=abilAcc(p,{grade1:p.grade===1});
 const gm=growMult()*gradeMult(p)*(0.8+p.potential*0.04)*fatPen*(meta.grow||1)*(1+condOf(p)*0.08);
 let eff=m.cat?catMult(m.cat):1.0;if(m.catReq&&!hasCat(m.cat))eff=0.3;if(p.training==='free'&&G.coach.style==='放任')eff*=1.4;
 const g=0.9*gm*eff*(m.tough&&alumniEff('stamina')?1.1:1)*coachSpec(m);
 const b=m.all?Object.fromEntries(ALL_BAT.map(k=>[k,m.all])):(m.b||{});
 const pp=m.all?Object.assign(Object.fromEntries(ALL_PIT.map(k=>[k,m.all])),{ctrl:.3,move:.3,sharp:.3,velo:.08}):(m.p||{});
 for(const k in b)grow(p,'bat',k,g*b[k]*(isPitcher(p)?0.6:1));
 if(isPitcher(p)){for(const k in pp){if(k==='velo')growVelo(p,g*pp[k]);else if(['ctrl','move','sharp'].includes(k))growPitch(p,k,g*pp[k]*1.4);else grow(p,'pit',k,g*pp[k]);}}
 if(m.tough&&p.tough<95)p.tough+=0.06;
 const med=catMult('medical');
 p.fatigue=clamp(p.fatigue+m.fat/((med-1)*0.5+1)+(G.camp?G.camp.fat*0.5:0)-5-dormRec()+(meta.fatigue||0),0,100);
 injuryCheck(p);
 abilityChance(p,p.training);
 talentReveal(p);
}
function injuryCheck(p,mult){const med=catMult('medical');let risk=(p.fatigue>55?(p.fatigue-55)/450:0.002)*(1.7-p.tough/100)*(G.ground.dur<30?1.5:1)/med*abilStatic(p,'injury')*(G.coach.style==='厳格'?1.1:1)*(mult||1);if(R()<risk){p.injury=ri(2,10);if(alumniEff('injury'))p.injury=Math.max(1,Math.round(p.injury*0.75));notice(`${p.name}がケガをした（全治${p.injury}週）。`);return true;}return false;}
function abilityChance(p,key){const base=0.012*(1+G.coach.level*0.08)*(G.coach.spec==='特能指導'?1.5:1)*(G.coach.style==='厳格'?1.3:1)*abilStatic(p,'learn');if(R()>base)return;const isP=isPitcher(p);
 const pool=ABIL_LIST.filter(a=>{const d=ABIL[a];if(!d.learn||!d.learn.includes(key)||d.u||d.neg)return false;if(d.t==='p'&&!isP)return false;if(d.t==='b'&&isP&&R()<0.7)return false;if(has(p,a))return false;return abilReqOk(p,a);});
 if(!pool.length)return;const a=pick(pool);p.abilities.push(a);notice(`${p.name}が特殊能力「${a}」を習得した！`);}
function learnMatchAbility(p,tag,prob){if(R()>prob*abilStatic(p,'learn'))return null;const isP=isPitcher(p);const pool=ABIL_LIST.filter(a=>{const d=ABIL[a];if(d.ml!==tag||d.u||d.neg)return false;if(d.t==='p'&&!isP)return false;if(d.t==='b'&&isP)return false;if(has(p,a))return false;return abilReqOk(p,a);});if(!pool.length)return null;const a=pick(pool);p.abilities.push(a);notice(`${p.name}が試合で「${a}」を習得！`);return a;}
function giveNegative(p,cands){if(abilStatic(p,'negImmune')>0)return null;if(G.coach.spec==='メンタル'&&R()<0.5)return null;const pool=cands.filter(a=>!has(p,a));if(!pool.length)return null;const a=pick(pool);p.abilities.push(a);return a;}
function tryAwaken(p,imp,perf){const base=(imp>=2?0.07:imp>=1.3?0.04:0.015)*abilStatic(p,'awaken')*(perf>=12?1.5:1);if(p.potential>=10||R()>base)return false;const add=ri(2,3);p.potential=Math.min(10,p.potential+add);p.awakened=(p.awakened||0)+1;for(const k in p.caps){if(k==='velo')p.caps.velo=Math.min(156,p.caps.velo+ri(3,6));else p.caps[k]=Math.min(100,p.caps[k]+ri(8,14));}
 notice(`${p.name}が覚醒した！潜在能力が大きく上昇した。`);addNews('特集',`${G.school.name}の${p.name}、覚醒の予感`,`大舞台での活躍をきっかけに${p.name}（${p.grade}年・${posName(p.pos)}）は一段上の選手へと変貌しつつある。関係者は「潜在能力が一気に開花した」と語る。`,{imp:3,pid:p.id});return true;}
function talentReveal(p){if(!p.revealed.P&&p.talentP>=70&&!isPitcher(p)&&R()<0.02+G.coach.level*0.006){p.revealed.P=true;notice(`監督が${p.name}の投手としての才能に気づいた！`);}if(!p.revealed.C&&p.talentC>=70&&p.pos!=='捕'&&R()<0.02+G.coach.level*0.006){p.revealed.C=true;notice(`監督が${p.name}の捕手としての才能に気づいた！`);}}
function mentorWeek(p){const s=G.players.find(x=>x.id===p.mentor.seniorId);if(!s||s.retired&&p.mentor.weeks>3||!has(s,p.mentor.ability)){notice(`${p.name}の先輩指導は中止になった。`);p.mentor=null;return;}p.mentor.weeks--;p.fatigue=clamp(p.fatigue+5-dormRec(),0,100);if(p.mentor.weeks<=0){const ok=R()<0.5+G.coach.level*0.045;if(ok&&!has(p,p.mentor.ability)){p.abilities.push(p.mentor.ability);notice(`${p.name}が${s.name}から「${p.mentor.ability}」を受け継いだ！`);addNews('部内',`先輩の技を継承`,`${G.school.name}の${p.name}（${p.grade}年）が先輩${s.name}の指導で「${p.mentor.ability}」を身につけた。`);}else notice(`${p.name}の先輩指導は実を結ばなかった…`);p.mentor=null;p.training=isPitcher(p)?'pitch':'bat';}}
function posChangeWeek(p){const pc=p.posChange;pc.weeks--;grow(p,'bat','field',0.3);p.fatigue=clamp(p.fatigue+8-dormRec(),0,100);if(pc.weeks<=0){if(pc.kind==='sub'){if(!p.sub.includes(pc.to)&&p.sub.length<4)p.sub.push(pc.to);notice(`${p.name}がサブポジション「${pc.to}」を習得した。`);}else{const old=p.pos;if(old!==pc.to){if(!p.sub.includes(old)&&p.sub.length<4&&old!=='投')p.sub.push(old);p.sub=p.sub.filter(x=>x!==pc.to);p.pos=pc.to;let boost=0;if(pc.to==='投'&&p.talentP>=70)boost=p.talentP>=85?16:10;if(pc.to==='捕'&&p.talentC>=70)boost=p.talentC>=85?14:9;if(pc.to==='投'){for(const k of ALL_PIT){p.pit[k]=clamp(p.pit[k]+boost+(boost?0:3),10,99);p.caps['pit'+k]=Math.max(p.caps['pit'+k],p.pit[k]+10);}growVelo(p,boost?boost*0.6:2);p.caps.velo=Math.max(p.caps.velo,veloCapFor(p.potential,p.pit.velo));if(p.pit.pitches.length<2){const n=pick(PITCH_NAMES);const off=PITCH_SPEED_OFF[n]||[-10,-20];p.pit.pitches.push({name:n,velo:p.pit.velo+ri(off[1],off[0]),move:40,sharp:40,ctrl:40});}if(boost)p.pit.pitches.forEach(pt=>{pt.move=clamp(pt.move+boost*0.7,1,99);pt.sharp=clamp(pt.sharp+boost*0.7,1,99);pt.ctrl=clamp(pt.ctrl+boost*0.5,1,99);});}
 if(pc.to==='捕'){['arm','field','thr'].forEach(k=>{p.bat[k]=clamp(p.bat[k]+boost+3,1,99);p.caps['bat'+k]=Math.max(p.caps['bat'+k],p.bat[k]+8);});}
 if(boost)notice(`${p.name}が${pc.to}に転向！才能が開花し能力が大幅に上がった！`);else notice(`${p.name}が${old}から${pc.to}にポジションを変更した。`);}}
 p.posChange=null;p.training=isPitcher(p)?'pitch':'bat';}}
function bodyGrowth(){for(const p of G.players){if(p.grade>=3||p.retired)continue;const dh=ri(0,2),dw=ri(0,3);p.height+=dh;p.weight+=dw;if(isPitcher(p)){const room=(p.caps.velo||150)-p.pit.velo;if(room>0){p.pit.velo=Math.min(p.caps.velo,p.pit.velo+Math.min(room,rf(0.5,2)*(0.6+p.potential*0.06)));p.pit.pitches[0].velo=Math.round(p.pit.velo);}}}}
function startMentor(p,seniorId,ability){const s=G.players.find(x=>x.id===seniorId);if(!s||!has(s,ability))return false;if(ABIL[ability].u)return false;p.mentor={seniorId,ability,weeks:8};p.training='mentor';return true;}
function startPosChange(p,to,kind){p.posChange={to,kind,weeks:kind==='sub'?4:6};p.training='posChange';return true;}

/* ================= 週進行 ================= */
function applyMaintenance(){const lv=GROUND_LV[G.ground.lv-1];let add=0;const gk=catMult('ground');const pick_=(g)=>active().filter(p=>p.injury===0&&(g==='all'||p.grade===g));let parts=[];
 if(G.maint==='pro'){if(G.money>=10){spend(10,'グラウンド整備(業者)');add=28*(alumniEff('ground')?1.2:1);}}
 else if(G.maint==='all')parts=pick_('all');else if(G.maint==='g1')parts=pick_(1);else if(G.maint==='g2')parts=pick_(2);
 if(parts.length){add=Math.min(30,parts.length*1.2)*(alumniEff('ground')?1.3:1);for(const p of parts){p.fatigue=clamp(p.fatigue+3,0,100);grow(p,'bat','speed',0.04);grow(p,'bat','field',0.03);}}
 G.ground.dur=clamp(G.ground.dur-3/gk+add*gk,0,lv.maxDur);}
function decayFacilities(){for(const k of FAC_KEYS){const f=G.fac[k];if(!f||f.broken)continue;if(R()<0.8)f.dur-=1;if(R()<0.08)f.dur-=1;if(f.dur<=0){f.dur=0;f.broken=true;notice(`${FAC[k].name}（${FAC[k].models[f.model].name}）が故障した！修理か買い替えが必要だ。`);}}}
function monthlyCosts(){if(G.coach.salary)spend(G.coach.salary/12,'監督給与');if(G.scout&&G.scout.salary)spend(G.scout.salary/12,'スカウト給与');const d=DORM_LV[G.dorm.lv];if(d.upkeep)spend(d.upkeep,'寮の維持費');spend(3+active().length*0.15,'用具・消耗品');const up=facUpkeep();if(up>0)spend(up,'設備維持費');if(G.month===4)spend(12,'保険・連盟登録費');}
function genPracticeList(){const list=[];const loc=shuffle(G.schools.pref).slice(0,4).map(s=>({name:s.name,strength:s.strength,dist:R()<0.5?0:1}));const far=[];for(let i=0;i<2;i++){const pr=pick(PREF_DATA);const pw=pick(G.schools.powers[pr.name]);far.push({name:pw.name,strength:Math.round(clamp(pw.strength+gauss(0,5),30,95)),dist:pr.region===G.school.region?2:3,pref:pr.name});}
 for(const o of loc.concat(far)){o.home=R()<0.5;o.cost=practiceCost(o);list.push(o);}return list;}
function practiceCost(o){const disc=Math.min(60,catSum('cost'))/100;const items={バス代:Math.round((4+o.dist*4)*(1-disc)*10)/10,運転手:Math.round(2*(1-disc)*10)/10,弁当代:2.5};if(o.dist>=3)items['宿泊費']=28;if(!o.home)items['球場使用料']=o.dist>=2?5:3;items.total=Math.round(Object.values(items).reduce((s,v)=>s+v,0)*10)/10;return items;}
function weekTick(){
 for(const p of G.players){trainPlayer(p);condWeekly(p);}
 applyMaintenance();decayFacilities();
 if(G.camp){G.camp.weeks--;if(G.camp.weeks<=0){G.camp=null;notice('合宿が終了した。');}}
 G.practiceList=genPracticeList();G.practicedThisWeek=false;
 G.week++;if(G.week>4){G.week=1;G.month=G.month===12?1:G.month+1;if(G.month===1)G.calYear++;if(G.month===4)G.year++;monthlyCosts();candidateMonthly();}
 if(G.week===3)featureArticles();
 G.turn++;
 fireEvents();
 maybeEvent();
}
function advanceWeek(){if(G.queue.length||G.gameOver)return false;weekTick();saveGame();return true;}
function fireEvents(){const key=G.month+'-'+G.week;
 switch(key){
  case '4-1':newFiscalYear();break;
  case '4-2':driftSchools();break;
  case '5-2':startTourney('district');break;
  case '6-1':genCandidates();notice('来年度入学の中学生情報が届いた。スカウトタブで確認しよう。');break;
  case '7-2':startTourney('pref');break;
  case '8-1':if(G.flags.koshien)startTourney('koshien');break;
  case '8-2':midSchoolNationals();break;
  case '8-3':enqueue({type:'camp',season:'夏'});break;
  case '8-4':u18Event();break;
  case '9-2':startTourney('autumnDistrict');break;
  case '9-3':if(G.flags.autumnPref)startTourney('autumnPref');break;
  case '9-4':if(G.players.some(p=>p.grade===3&&!p.path))enqueue({type:'career'});break;
  case '10-4':draftEvent();break;
  case '10-1':bodyGrowth();break;
  case '10-2':if(G.flags.regional)startTourney('regional');break;

  case '12-3':enqueue({type:'camp',season:'冬'});break;
  case '1-2':refreshMarkets();notice('監督・スカウトの候補者情報が更新された（経営タブ）。');break;
  case '1-4':senbatsuSelection();break;

  case '3-3':enqueue({type:'graduation'});break;
  case '3-4':staffLeaveCheck();yearEndRecord();if(G.goal)evaluateGoal();enqueue({type:'yearEnd'});break;
 }
}
function newFiscalYear(){
 G.players.forEach(p=>{p.grade++;p.season=blankStats();p.u18=0;});
 G.players=G.players.filter(p=>p.grade<=3);
 G.budgetMult=G.nextBudgetMult||1;G.nextBudgetMult=1;
 G.budget=calcBudget();G.money+=G.budget;G.fin={income:G.budget,expense:0,items:{'学校予算':G.budget}};
 updateAlumni();
 G.coach.age++;G.coach.years++;if(G.scout){G.scout.age++;G.scout.years++;}
 G.school.principalUsed=false;G.flags={};G.results={};
 bodyGrowth();
 const newbies=makeNewMembers();
 ensurePositions();autoLineup();autoNumbers();
 G.rep=clamp(G.rep-1+Math.round(Object.values(G.fac).filter(f=>f&&!f.broken).length*0.3+catSum('rep')),0,100);
 if(G.goal)announceGoal();

 addNews('学校',`${G.calYear}年度の予算決定`,`${G.school.name}野球部の今年度予算は${yen(G.budget)}となった。評判${G.rep}、予算係数${(G.budgetMult*100).toFixed(0)}%。`);
}
function makeNewMembers(){const newbies=[];for(const r of G.recruits){let p;if(r.player){p=r.player;p.grade=1;p.joinYear=G.year;p.scouted=true;p.rank=r.rank;p.title=r.title;p.hometown=r.pref;p.season=blankStats();p.fatigue=ri(0,15);}else{p=genPlayer({grade:1,q:r.q,pos:r.pos,name:r.name,scouted:true,rank:r.rank,title:r.title,hometown:r.pref,uniqProb:r.rank==='S'?0.6:r.rank==='A'?0.35:r.rank==='B'?0.15:0.05});if(r.throws){p.throws=r.throws;}if(r.unique&&!p.unique.length)p.unique.push(r.unique);}G.players.push(p);newbies.push(p);if(r.title)addNews('特集',`${G.school.name}に入学の${p.name}君、中学時代は${r.title}！`,`この春${G.school.name}に入学した${p.name}君（${posName(p.pos)}）は、中学時代に${r.title}の実績を持つ逸材。${r.pref!==G.school.pref?r.pref+'から':''}${G.school.name}を選んだ理由を「設備と監督の熱意」と語った。`);}
 G.recruits=[];const nWalk=clamp(ri(10,14)-Math.max(0,newbies.length-4),4,14);
 for(let i=0;i<nWalk;i++){const q=clamp(gauss(37+G.rep*0.16-Math.max(0,G.school.hensachi-60)*0.35,7),22,70);G.players.push(genPlayer({grade:1,q}));newbies.push(G.players[G.players.length-1]);}
 return newbies;}
function retireThirdYears(reason){const t=G.players.filter(p=>p.grade===3&&!p.retired);if(!t.length)return;t.forEach(p=>{p.retired=true;p.training='rest';p.mentor=null;p.posChange=null;});G.players.forEach(p=>{if(p.mentor&&t.some(x=>x.id===p.mentor.seniorId)){p.mentor=null;p.training='bat';}});notice(`3年生${t.length}人が引退した（${reason}）。新チームが始動する。`);autoLineup();autoNumbers();}

{lv:2,text:'夏の県大会ベスト4以上',check:r=>['優勝','準優勝','ベスト4'].includes(r.pref)},
{lv:3,text:'夏の県大会 決勝進出',check:r=>['優勝','準優勝'].includes(r.pref)},

{lv:6,text:'甲子園ベスト4以上',check:r=>r.pref==='優勝'&&['優勝','準優勝','ベスト4'].includes(r.koshien)},

function announceGoal(){const g=G.goal;g.text=GOALS[g.level-1].text;enqueue({type:'msg',title:'理事会からの通達',body:`今年度の目標：${g.text}\n加えて年度末に赤字を出さないこと。\n現在の理事会の信頼度：${g.trust}\n目標を達成できなければ信頼を失い、信頼度が0になると監督は解任される。`});}
function evaluateGoal(){const g=G.goal;const def=GOALS[g.level-1];const ok=def.check(G.results);let d=ok?20:-30;let notes=[];if(ok){notes.push('目標達成（+20）');if(G.results.koshien==='優勝'){d+=20;notes.push('全国制覇ボーナス（+20）');}}else notes.push('目標未達（-30）');if(G.money<0){d-=15;notes.push('赤字決算（-15）');}
 g.trust=clamp(g.trust+d,-100,100);g.history.push({year:G.calYear,text:g.text,ok,d,trust:g.trust});
 const fired=g.trust<=0;if(ok&&g.level<7)g.level++;
 if(fired){G.gameOver=true;addNews('学校',`${G.school.name}、${G.coach.name}監督を解任`,`理事会は目標未達を理由に監督の解任を決めた。`);}

function userRoster(){ensureLineup();const a=active();const lineup=G.lineup.map(s=>({p:a.find(x=>x.id===s.pid),pos:s.pos})).filter(s=>s.p);const sp=lineup.find(s=>s.pos==='投');return {name:G.school.name,isUser:true,strength:teamStrength(),pref:G.school.pref,lineup,bench:benchPlayers(),pitcher:sp?sp.p:lineup[8].p,starters:new Set(lineup.map(s=>s.p.id))};}

 t.defR=avg(f.map(s=>fx(s,'rfR','rbR')))+defAdd;t.defL=avg(f.map(s=>fx(s,'rfL','rbL')))+defAdd;t.errRes=clamp(errRes/8,-0.5,0.6);
 const c=t.lineup.find(s=>s.pos==='捕');if(c){const acc=abilAcc(c.p,posCtx('捕'));t.catcherArm=c.p.bat.arm*0.6+c.p.bat.thr*0.4+(acc.arm||0)*0.6+(acc.stealDef||0);}else t.catcherArm=40;

function bst(t,p){if(!t.stats[p.id])t.stats[p.id]={p,pa:0,ab:0,h:0,hr:0,rbi:0,bb:0,so:0,sb:0,r:0,d:0,tr:0};return t.stats[p.id];}

function isSummer(){return G.month===7||G.month===8;}

class Match{

  if(d.needPitcher){const rel=d.bench.filter(x=>isPitcher(x)||x.sub.includes('投')).sort((a,b)=>pitRating(b)-pitRating(a))[0];const slot=d.lineup.find(s=>s.pos==='投');if(rel)this.changePitcher(d,rel);else{d.pitcher=slot?slot.p:d.pitcher;pst(d,d.pitcher);d.needPitcher=false;this.addLog(`${d.name} 投手がいないため${d.pitcher.name}が登板`,'sub');}}
  this.addLog(`${this.inn}回${this.top?'表':'裏'} ${this.bat().name}の攻撃`,'inn');
  if(this.inn>=10){const t=this.bat(),n=t.lineup.length;this.bases[0]=t.lineup[(t.batIdx+n-1)%n].p;this.bases[1]=t.lineup[(t.batIdx+n-2)%n].p;this.addLog('タイブレーク：無死一・二塁から開始','note');}}
 situation(){const t=this.bat(),d=this.def();const s=t.lineup[t.batIdx];return {inn:this.inn,top:this.top,outs:this.outs,bases:this.bases.map(b=>b?b.name:null),batter:s.p,batPos:s.pos,order:t.batIdx+1,pitcher:d.pitcher,pc:d.pc[d.pitcher.id]||0,score:this.score.slice(),batTeam:t.name,defTeam:d.name};}

 /* 状況フラグ */

  return {risp:!!(this.bases[1]||this.bases[2]),loaded:this.bases.every(Boolean),runners:this.bases.some(Boolean),empty:!this.bases.some(Boolean),twoOut:this.outs===2,noOut:this.outs===0,late:this.inn>=7,early:this.inn<=3,extra:this.inn>=10,big:this.bigStage(),behind:diff<=-3,behind1:diff<0,ahead:diff>0,tie:diff===0,close:Math.abs(diff)<=1,walkoff:!this.top&&this.inn>=9&&this.score[1]<=this.score[0],summer:isSummer(),spring:isSpring()};}
 batCtx(b,p,pitch){const t=this.bat();const c=this.baseCtx('bat');const bs=bst(t,b);const idx=t.batIdx;Object.assign(c,{firstPA:bs.pa===0,hot:bs.h>=2,cold:bs.ab>=2&&bs.h===0,vsL:p.throws==='左',vsR:p.throws==='右',vsAce:pitRating(p)>=70,vsWeak:pitRating(p)<50,vsBreak:pitch.name!=='ストレート',vsFast:pitch.name==='ストレート',pinch:!t.starters.has(b.id),leadoff:idx===0,cleanup:idx>=2&&idx<=4,lower:idx>=6});return c;}
 pitCtx(p,b,pitch){const d=this.def();const c=this.baseCtx('def');const ps=pst(d,p);const bHand=b.bats==='両'?(p.throws==='右'?'左':'右'):b.bats;Object.assign(c,{pL:bHand==='左',pR:bHand==='右',vsPower:(b.bat.powR+b.bat.powL)/2>=68,vsWeak:batRating(b)<48,fast:pitch.name==='ストレート',break:pitch.name!=='ストレート',reliever:ps.order>0,starter:ps.order===0,tired:(d.pc[p.id]||0)>this.pitchCap(p),fresh:(d.pc[p.id]||0)<40,left:p.throws==='左'});return c;}
 teamBoost(t,ctx){let b=t.extraBoost||0;for(const s of t.lineup){const acc=abilAcc(s.p,Object.assign({},ctx,posCtx(s.pos)));b+=acc.team||0;}return Math.min(b,8);}

 /* 1打席処理 cmd: null|'bunt'|'steal'|'hitrun'|'ibb' */

function bracketSVG(t){const P=t.P||Math.pow(2,t.rounds.length);const nR=t.rounds.length>=Math.log2(P)?Math.log2(P):Math.log2(P);const rowH=22,colW=138,left=6,top=14;const W=left+colW*(nR+1)+30,H=top+P*rowH+10;
 const cols=[];cols.push(t.slots?t.slots.map(x=>x):t.rounds[0].flatMap(m=>[m.a,m.b]));
 for(let r=0;r<nR;r++){const rd=t.rounds[r];const ws=[];for(let i=0;i<P/Math.pow(2,r+1);i++){const m=rd&&rd[i];ws.push(m&&m.w?winnerOf(m):null);}cols.push(ws);}
 const yOf=(c,j)=>top+(j+0.5)*Math.pow(2,c)*rowH;
 let svg='';
 for(let c=0;c<=nR;c++){const n=P/Math.pow(2,c);for(let j=0;j<n;j++){const x=left+c*colW;const y=yOf(c,j);const team=cols[c][j];const isSlot=c===0;const rd=c>0?t.rounds[c-1]:null;const m=rd?rd[j]:null;
   let label='';let cls='tm';if(team){label=team.name;if(team.isUser)cls+=' ours';}else if(isSlot)label='（シード）';else label='';
   if(c<nR){const nx=x+colW;const my=yOf(c+1,Math.floor(j/2));const ex=x+colW-14;svg+=`<path d="M${x+colW-26},${y} H${ex} V${my} H${nx-2}" class="bl" fill="none"/>`;
    const mm=t.rounds[c]&&t.rounds[c][Math.floor(j/2)];if(mm&&mm.s&&j%2===0){const sc=mm.w==='a'?mm.s[0]:mm.s[1];}
    if(mm&&mm.s){const mine=(j%2===0)?mm.s[0]:mm.s[1];svg+=`<text x="${ex-3}" y="${y-3}" class="bs" text-anchor="end">${mine}</text>`;}
    if(mm&&mm.user)svg+=`<circle cx="${ex}" cy="${my}" r="2.5" class="bu"/>`;}
   if(label)svg+=`<text x="${x+2}" y="${y+4}" class="${cls}${team&&c>0?' w':''}">${esc(label.length>9?label.slice(0,9)+'…':label)}</text>`;}}
 if(t.done&&t.champion)svg+=`<text x="${left+nR*colW+2}" y="${yOf(nR,0)-14}" class="bc">優勝</text>`;
 const heads=[];for(let c=1;c<=nR;c++){heads.push(`<text x="${left+c*colW+2}" y="9" class="bh">${roundName(t,c-1)}</text>`);}
 return `<div class="bracket"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="トーナメント表"><style>.tm{font-size:11px;fill:var(--ink)}.tm.ours{fill:var(--accent);font-weight:700}.tm.w{font-weight:700}.bl{stroke:var(--muted);stroke-width:1}.bs{font-size:9px;fill:var(--muted);font-family:var(--font-num)}.bu{fill:var(--accent2)}.bh{font-size:10px;fill:var(--muted);font-weight:700}.bc{font-size:11px;fill:var(--gold);font-weight:700}</style>${heads.join('')}${svg}</svg></div>`;}

/* ================= 調子（コンディション） ================= */
function condOf(p){return p.cond&&p.cond.w>0?p.cond.v:0;}
function setCond(p,v,w){p.cond={v:clamp(v,-2,2),w:w||ri(3,6)};}
function condLabel(p){const v=condOf(p);return v>=2?'絶好調':v===1?'好調':v===-1?'不調':v<=-2?'絶不調':'普通';}
function condIcon(p){const v=condOf(p);return v>=2?'⤴⤴':v===1?'⤴':v===-1?'⤵':v<=-2?'⤵⤵':'';}
function condWeekly(p){if(p.cond&&p.cond.w>0){p.cond.w--;if(p.cond.w<=0)p.cond=null;}else if(R()<0.05){setCond(p,R()<0.55?1:-1,ri(3,6));}}
/* ================= ランダムイベント ================= */
function boostStats(p,keys,amt){for(const k of keys){if(ALL_BAT.includes(k))grow(p,'bat',k,amt);else if(ALL_PIT.includes(k))grow(p,'pit',k,amt);else if(k==='velo')growVelo(p,amt*0.3);else if(['ctrl','move','sharp'].includes(k))growPitch(p,k,amt);}}
function teamFatigue(d){for(const p of active())p.fatigue=clamp(p.fatigue+d,0,100);}
function evPlayer(){const a=active().filter(p=>p.injury===0);return a.length?pick(a):null;}

function maybeEvent(){if(G.queue.length)return;const key=G.month+'-'+G.week;if(['4-1','7-2','8-1','2-3','3-3','10-4','9-4'].includes(key))return;if(R()>0.14)return;const pool=EVENTS.filter(e=>!(e.p&&!evPlayer()));const tot=sum(pool.map(e=>e.w));let r=R()*tot;let ev=pool[0];for(const e of pool){r-=e.w;if(r<=0){ev=e;break;}}const p=ev.p?evPlayer():null;enqueue({type:'event',id:ev.id,pid:p?p.id:null});}
function eventById(id){return EVENTS.find(e=>e.id===id);}

const SAVE_KEY='hsb_save_v1';
function serialize(){return JSON.stringify(G);}
function saveGame(){try{localStorage.setItem(SAVE_KEY,serialize());}catch(e){}}
function loadGame(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;const g=JSON.parse(s);if(!g||!g.players)return false;G=g;migrate();return true;}catch(e){return false;}}

 if(G.fac&&G.fac.analysis){G.fac.video=G.fac.analysis;delete G.fac.analysis;}
 for(const k in G.fac){if(!FAC[k]){delete G.fac[k];continue;}const f=G.fac[k];if(f.model>=FAC[k].models.length)f.model=FAC[k].models.length-1;}
 if(G.coach&&!G.coach.style){G.coach.style=pick(COACH_STYLES).id;G.coach.bio=G.coach.bio||(G.coach.type==='教師'?'学校の先生':'外部招へい');G.coach.career=G.coach.career||'';}
 if(G.scout&&!SCOUT_SPECS.some(x=>x.id===G.scout.spec))G.scout.spec=pick(SCOUT_SPECS).id;
 (G.coachMarket||[]).forEach(c=>{if(!c.style)c.style=pick(COACH_STYLES).id;if(!c.career)c.career='';});
 (G.scoutMarket||[]).forEach(c=>{if(!SCOUT_SPECS.some(x=>x.id===c.spec))c.spec=pick(SCOUT_SPECS).id;if(!c.career)c.career='';});
 G.players.forEach(p=>{if(TRAIN[p.training]&&TRAIN[p.training].facReq)p.training='bat';if(p.maxVelo==null)p.maxVelo=0;if(!p.persona)p.persona=pickPersona();if(p.trust==null)p.trust=clamp(Math.round(gauss(38,12)+(p.grade-1)*12),5,90);if(p.noise&&p.noise.pot==null)p.noise.pot=gauss(0,1);p.abilities=(p.abilities||[]).filter(a=>ABIL[a]);p.unique=(p.unique||[]).filter(a=>ABIL[a]);});
 G.records=G.records||{};G.candidatesAll=G.candidatesAll||G.candidates||[];
 for(const c of G.candidatesAll){if(!c.player){c.player=genPlayer({grade:1,q:c.q,pos:c.pos,scouted:true,rank:c.rank,title:c.title,hometown:c.pref,uniqProb:0});if(c.unique)c.player.unique=[c.unique];c.player.name=c.name;c.pid=c.player.id;c.potential=c.player.potential;c.growth=c.player.growth;}}
 G.graduates.forEach(g=>{if(!g.career)g.career=blankStats();});}

 const sh={circle:'<circle cx="50" cy="50" r="44"/>',shield:'<path d="M50 6 L90 18 L88 56 Q84 84 50 96 Q16 84 12 56 L10 18 Z"/>',diamond:'<path d="M50 5 L95 50 L50 95 L5 50 Z"/>',hex:'<path d="M50 5 L89 27 L89 73 L50 95 L11 73 L11 27 Z"/>',star:'<path d="M50 5 L61 36 L95 38 L68 58 L78 92 L50 72 L22 92 L32 58 L5 38 L39 36 Z"/>',sakura:'<path d="M50 10 C62 10 70 20 66 32 C78 28 90 36 88 48 C100 56 96 72 84 76 C86 90 72 98 62 90 C56 100 44 100 38 90 C28 98 14 90 16 76 C4 72 0 56 12 48 C10 36 22 28 34 32 C30 20 38 10 50 10 Z"/>',pent:'<path d="M50 6 L94 38 L77 92 L23 92 L6 38 Z"/>'};

 if(u.style==='placket'&&view==='front')over=`<path d="M100,46 L100,205" stroke="${trim}" stroke-width="5"/><path d="M92,46 L92,205 M108,46 L108,205" stroke="${trim}" stroke-width="1.5"/><g fill="${esc(u.base)}" stroke="${trim}" stroke-width="1">${[80,110,140,170].map(y=>`<circle cx="100" cy="${y}" r="3"/>`).join('')}</g>`;

function candCard(c){const dm=c.demands.map(d=>`<span class="dm ${DEMANDS[d].met()?'ok':'ng'}">${DEMANDS[d].met()?'✔':'✖'}${esc(DEMANDS[d].text)}</span>`).join('');const stars='★'.repeat(c.info)+'☆'.repeat(3-c.info);
 const act=c.signed?'<span class="badge">入部内定</span>':c.lost?`<span class="badge gray">他校に決定${c.lostTo?'（'+esc(c.lostTo)+'）':''}</span>`:`<div class="wrap">${b('視察 '+(8+(c.pref===G.school.pref?0:8))+'万','candVisit',{id:c.id},'sm')}${b('交渉 '+candNegoCost(c)+'万','candNego',{id:c.id},'sm primary')}${G.school.principalUsed?'':b('校長同行で交渉','candNego',{id:c.id,pr:1},'sm')}</div>`;
 return `<div class="cand ${c.signed?'signed':''} ${c.lost?'lost':''}"><div class="row" style="align-items:flex-start"><div class="row" style="justify-content:flex-start;gap:8px"><span data-act="candDetail" data-id="${c.id}" style="cursor:pointer">${avatarFor({avatar:{seed:c.pid,pref:c.pref},size:48})}</span><div><b data-act="candDetail" data-id="${c.id}" style="cursor:pointer">${esc(c.name)}</b> <span class="muted small">${posName(c.pos)}・${c.throws}投・${esc(c.pref)}${c.msch?'・'+esc(c.msch):''}</span><br>${c.title?`<span class="badge gold">${esc(c.title)}</span>`:''}${c.conn?` <span class="badge">${esc(c.conn)}</span>`:''}</div></div><div class="right"><div>ランク ${rk(candDispRank(c))}</div><div class="tiny">潜在 ${esc(candDispPot(c))}</div><div class="tiny muted">情報 ${stars}</div></div></div>
  <div class="row small" style="margin-top:4px"><span>興味</span><span class="num">${c.interest}/80${c.negos?'（交渉'+c.negos+'回）':''}</span></div><div class="bar"><i class="${c.interest>=60?'':'warn'}" style="width:${Math.round(c.interest/80*100)}%"></i></div>
  <div style="margin-top:4px">${dm||'<span class="dm ok">要望なし</span>'}</div><div class="row" style="margin-top:6px">${act}${b('能力を見る','candDetail',{id:c.id},'sm ghost')}</div></div>`;}
function viewScout(){const sl=G.scout?G.scout.level:0;const f=UI.scoutFilter;let list=visibleCandidates();if(f==='open')list=list.filter(c=>!c.signed&&!c.lost);else if(f==='signed')list=list.filter(c=>c.signed);else if(f==='lost')list=list.filter(c=>c.lost);
 list=list.slice().sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank));
 const cards=list.map(candCard).join('');
 const chips=[['open','交渉中'],['signed','内定'],['lost','他校決定'],['all','すべて']].map(x=>`<button class="btn sm ${f===x[0]?'on':''}" data-act="sfilter" data-f="${x[0]}">${x[1]}</button>`).join('');
 return `<div class="hd">スカウト</div>
 <section class="card"><div class="kv"><b>スカウト</b><span>${G.scout?esc(G.scout.name)+'（Lv'+G.scout.level+'・'+esc(G.scout.spec)+'）':'なし（情報の精度が低く、県内の選手しか見えません）'}</span><b>校長同行</b><span>${G.school.principalUsed?'今年度は使用済み':'あと1回使える（大幅に興味アップ）'}</span><b>来春の内定者</b><span>${G.recruits.length?G.recruits.map(r=>esc(r.name)+'（'+posName(r.pos)+'）').join('、'):'まだいない'}</span></div><div class="hint">6月に候補が公開され、2月末が締切。興味が80に達すると入部内定。「能力を見る」で視察で分かった能力・潜在能力・特能を確認できます（視察を重ねるほど正確に）。S・Aランクは他校に決められやすいので早めに動きましょう。</div></section>

function candDetailHtml(c){const p=c.player;const info=c.info;const sl=G.scout?G.scout.level:0;const fog=info>=3?0:info===2?0.35:info===1?0.7:1;
 const fz=(v,k)=>{if(fog>=1)return '？';const n=clamp(p.noise[k]||0,-2,2);const sv=clamp(v+n*fog*14,1,100);return fog===0?letter(sv)+' '+Math.round(sv):fog<0.5?letter(sv)+'±':letter(sv)+'?';};
 const batRows=BAT_KEYS.map(k=>`<span>${k[1]}</span><span>${fz(p.bat[k[0]],'bat'+k[0])}</span>`).join('');
 const pitRows=isPitcher(p)?`<span>球速</span><span>${fog>=1?'？':Math.round(p.pit.velo+(p.noise.velo||0)*fog*5)+'km/h'}</span>`+PIT_KEYS.map(k=>`<span>${k[1]}</span><span>${fz(p.pit[k[0]],'pit'+k[0])}</span>`).join('')+`<span>球種</span><span>${fog>=1?'？':p.pit.pitches.map(x=>esc(x.name)).join('・')}</span>`:'';
 const abil=info>=3?(p.unique.map(a=>`<span class="ab u">${esc(a)}</span>`).join('')+p.abilities.map(a=>`<span class="ab ${ABIL[a]&&ABIL[a].neg?'neg':''}">${esc(a)}</span>`).join('')||'<span class="muted small">なし</span>'):(c.uniqueKnown&&p.unique.length?`<span class="ab u">${esc(p.unique[0])}</span><span class="muted small">（噂）</span>`:'<span class="muted small">視察を重ねると判明</span>');
 const effs=info>=3?p.unique.concat(p.abilities).map(a=>ABIL[a]?`<div class="abrow"><span class="ab ${ABIL[a].u?'u':ABIL[a].neg?'neg':''}">${esc(a)}</span><span class="small">${esc(ABIL[a].d)}。${esc(ABIL[a].e)}</span></div>`:'').join(''):'';
 return `<h2>${esc(c.name)} <span class="muted small">${posName(c.pos)}・${c.throws}投${p.bats}打・${esc(c.pref)}${c.msch?'・'+esc(c.msch):''}</span></h2>
 <div class="row" style="align-items:flex-start"><div>${avatarFor({avatar:{seed:c.pid,pref:c.pref},size:96})}</div><div class="kv" style="flex:1"><b>ランク</b><span>${rk(candDispRank(c))}</span><b>潜在能力</b><span>${esc(candDispPot(c))}${sl<4?'<br><span class="tiny muted">スカウトLv4以上で見当がつく</span>':''}</span><b>成長型</b><span>${info>=2?p.growth:'？'}</span><b>体格</b><span>${p.height}cm / ${p.weight}kg</span><b>情報</b><span>${'★'.repeat(info)+'☆'.repeat(3-info)}（視察で向上）</span>${c.title?`<b>実績</b><span>${esc(c.title)}</span>`:''}</div></div>
 <div style="margin:6px 0"><b class="small">特殊能力</b><div>${abil}</div>${effs}</div>
 <div class="grid2 stats"><div><b class="small">野手能力</b><div class="stat">${batRows}</div></div><div>${pitRows?`<b class="small">投手能力</b><div class="stat">${pitRows}</div>`:''}</div></div>
 <div class="hint">数値は視察の進み具合（情報★）とスカウトのレベルで正確になります。</div>
 ${c.signed||c.lost?'':`<div class="wrap" style="margin-top:8px">${b('視察 '+(8+(c.pref===G.school.pref?0:8))+'万','candVisitM',{id:c.id},'sm')}${b('交渉 '+candNegoCost(c)+'万','candNegoM',{id:c.id},'sm primary')}${G.school.principalUsed?'':b('校長同行で交渉','candNegoM',{id:c.id,pr:1},'sm')}</div>`}`;}

 else if(t==='abil'){const grp=(title,keys)=>`<section class="card"><h3>${title}</h3>${keys.map(a=>`<div class="abrow"><span class="ab ${ABIL[a].u?'u':ABIL[a].neg?'neg':''}">${esc(a)}</span><span class="small">${esc(ABIL[a].d)}。${esc(ABIL[a].e||'')}</span></div>`).join('')}</section>`;

 else{body=`<section class="card"><h3>試合設定</h3><label class="f">試合の進め方（標準）<select data-chg="simMode">${SIM_MODES.map(m=>`<option value="${m.id}"${G.settings.mode===m.id?' selected':''}>${m.name}</option>`).join('')}</select></label><div class="hint">試合ごとにオーダー画面でも選べます。<b>采配カード</b>は手札のカード（強振・待球・盗塁・低めに集めろ…）で指示を出し、カードの★・選手の信頼度・性格・能力で結果が決まる栄冠ナイン風モード。打席ごとに最終球と打球のプレーが再生されます（≡メニューで演出の長さを変更可）。<b>アクション操作</b>は投球コースやスイングをリアルタイムで自分で操作する上級者向けモードです。</div></section>

function newsIssues(){const map=new Map();for(const n of G.news){const key=(n.cy||G.calYear)+'-'+(n.mo||G.month);if(!map.has(key))map.set(key,{key,cy:n.cy||G.calYear,mo:n.mo||G.month,items:[]});map.get(key).items.push(n);}
 const issues=[...map.values()].sort((a,b)=>(b.cy-a.cy)||(b.mo-a.mo));for(const is of issues)is.items.sort((a,b)=>(b.imp||1)-(a.imp||1));return issues;}
function articleBody(n,max){const t=n.body||'';if(!max||t.length<=max)return esc(t);return esc(t.slice(0,max))+'…';}
function viewNewsPaper(){const issues=newsIssues();if(!issues.length)return '<div class="muted small">記事はまだありません</div>';
 UI.newsIssue=clamp(UI.newsIssue||0,0,issues.length-1);const is=issues[UI.newsIssue];const cat=UI.newsCat||'all';
 const cats=['all',...new Set(G.news.map(n=>n.cat))];const chips=cats.map(c=>`<button class="btn sm ${cat===c?'on':''}" data-act="newsCat" data-c="${esc(c)}">${c==='all'?'紙面':esc(c)}</button>`).join('');
 if(cat!=='all'){const list=G.news.filter(n=>n.cat===cat).slice(0,80);return `<div class="subtabs">${chips}</div><div class="paper">${list.map(n=>`<div class="news"><span class="cat">${esc(n.cat)}</span><span class="tiny muted">${esc(n.t)}</span><h4>${esc(n.title)}</h4><p>${esc(n.body)}</p></div>`).join('')}</div>`;}
 const items=is.items;const lead=items[0];const secs=items.slice(1,4);const briefs=items.slice(4);
 const nav=`<div class="pnav">${b('◀ 前の号','newsIssue',{d:1},'sm'+(UI.newsIssue>=issues.length-1?' ':''))}<span class="pno">${is.cy}年${is.mo}月号（${issues.length-UI.newsIssue}／${issues.length}）</span>${b('次の号 ▶','newsIssue',{d:-1},'sm')}</div>`;
 const leadHtml=`<article class="lead" data-act="newsOpen" data-i="${G.news.indexOf(lead)}"><div class="lead-photo">${avatarFor(Object.assign({size:120},lead))}<div class="cap">${lead.pid?esc(playerNameById(lead.pid)):(lead.avatar&&lead.avatar.pref?esc(lead.avatar.pref)+'の注目選手':'写真')}</div></div><div class="lead-txt"><span class="cat">${esc(lead.cat)}</span><h2>${esc(lead.title)}</h2><p class="body">${articleBody(lead,260)}</p></div></article>`;
 const secHtml=secs.map(n=>`<article class="sec" data-act="newsOpen" data-i="${G.news.indexOf(n)}">${(n.pid||n.avatar)?`<div class="sec-photo">${avatarFor(Object.assign({size:64},n))}</div>`:''}<div><span class="cat">${esc(n.cat)}</span><h3>${esc(n.title)}</h3><p>${articleBody(n,120)}</p></div></article>`).join('');
 const briefHtml=briefs.length?`<div class="briefs"><div class="bh">短信</div>${briefs.map(n=>`<div class="brief" data-act="newsOpen" data-i="${G.news.indexOf(n)}"><span class="cat">${esc(n.cat)}</span>${esc(n.title)}</div>`).join('')}</div>`:'';
 return `<div class="subtabs">${chips}</div>${nav}<div class="paper2"><div class="mast"><div class="mast-l">${esc(G.school.pref)}高校野球新聞</div><div class="mast-r">${is.cy}年${is.mo}月号<br>${esc(G.school.name)}版</div></div>${leadHtml}<div class="secs">${secHtml}</div>${briefHtml}<div class="foot">${esc(G.school.pref)}高校野球新聞社　記事中の似顔絵はイメージです</div></div>${nav}`;}
function playerNameById(id){const p=G.players.find(x=>x.id==id)||G.graduates.find(x=>x.id==id);return p?p.name+(p.grade?'（'+G.school.name+'）':'（'+G.school.name+'OB）'):'';}
ACT.newsIssue=d=>{const issues=newsIssues();UI.newsIssue=clamp((UI.newsIssue||0)+parseInt(d.d),0,issues.length-1);render();window.scrollTo(0,0);};
ACT.newsOpen=d=>{const n=G.news[parseInt(d.i)];if(!n)return;openModal(`<div class="paper2 single"><div class="mast"><div class="mast-l">${esc(G.school.pref)}高校野球新聞</div><div class="mast-r">${esc(n.t)}</div></div><article class="lead"><div class="lead-photo">${avatarFor(Object.assign({size:140},n))}<div class="cap">${n.pid?esc(playerNameById(n.pid)):(n.avatar&&n.avatar.pref?esc(n.avatar.pref)+'の注目選手':'写真')}</div></div><div class="lead-txt"><span class="cat">${esc(n.cat)}</span><h2>${esc(n.title)}</h2><p class="body">${esc(n.body)}</p></div></article></div>`);};

function viewRecords(){const rec=G.records||{};const rows=Object.keys(REC_DEF).map(k=>{const r=rec[k];const d=REC_DEF[k];const jp=JP_RECORDS[k];return `<tr><td class="l">${d.label}</td><td>${r?r.v+(d.unit||''):'-'}</td><td class="l">${r?esc(r.name)+'（'+r.year+'年）':'<span class="muted">未達成（'+d.min+(d.unit||'')+'以上で記録）</span>'}</td><td class="l muted">${jp?esc(jp.label):''}</td></tr>`;}).join('');
 return `<section class="card"><h3>校記録</h3><div class="tw"><table class="t"><tr><th class="l">項目</th><th>記録</th><th class="l">選手</th><th class="l">参考（全国）</th></tr>${rows}</table></div><div class="hint">校記録を更新すると新聞に載ります。参考記録に並ぶ・上回ると大きな記事になり評判が大きく上がります。</div></section><div class="hd" style="font-size:17px">歴代通算ランキング</div>${rankingHtml()}`;}

function lineupHtml(){ensureLineup();if(!G.lineup)return '<div class="muted small">選手が足りません</div>';return G.lineup.map((s,i)=>{const p=pById(s.pid);if(!p)return '';return `<div class="row small" style="padding:3px 0;border-bottom:1px solid var(--line)"><span><span class="num muted">${i+1}</span> ${s.pos} <b>${esc(p.name)}</b> <span class="muted">#${p.number||'-'} ${p.grade}年</span></span><span>${rk(isPitcher(p)&&s.pos==='投'?pitRating(p):batRating(p))}</span></div>`;}).join('');}
function viewMatch(){const lm=G.lastMatch;const t=G.tourney;
 const a=active();const bat=a.filter(p=>p.season.pa>0).sort((x,y)=>y.season.pa-x.season.pa).slice(0,15);const pit=a.filter(p=>p.season.ipo>0).sort((x,y)=>y.season.ipo-x.season.ipo);
 const batT=bat.map(p=>{const s=p.season;return `<tr><td class="l">${esc(p.name)}</td><td>${s.g}</td><td>${s.ab}</td><td>${s.ab?(s.h/s.ab).toFixed(3):'-'}</td><td>${s.h}</td><td>${s.hr}</td><td>${s.rbi}</td><td>${s.sb}</td><td>${s.bb}</td><td>${s.so}</td></tr>`;}).join('');
 const pitT=pit.map(p=>{const s=p.season;return `<tr><td class="l">${esc(p.name)}</td><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${ipStr(s.ipo)}</td><td>${s.ipo?(s.per*27/s.ipo).toFixed(2):'-'}</td><td>${s.pk}</td><td>${s.pbb}</td><td>${s.ph}</td></tr>`;}).join('');
 return `<div class="hd">試合</div>
 ${t&&!t.done?`<section class="card"><h3>${esc(t.name)} <small>進行中</small></h3>${b('大会画面を開く','openQueue',{},'primary')}</section>`:''}
 <section class="card"><h3>スターティングオーダー <small>${b('編集','lineupEdit',{},'sm')} ${b('自動','lineupAuto',{},'sm')}</small></h3>${lineupHtml()}<div class="hint">大会・練習試合の直前にも変更できます。ケガ人は自動で外れます。</div></section>
 ${lm?`<section class="card"><h3>直近の試合 <small>${esc(lm.date)}</small></h3><div class="row"><b>${esc(lm.label)}</b><span>${lm.won?'<span class="badge">勝利</span>':'<span class="badge red">敗戦</span>'}</span></div><div class="center" style="font-size:22px" ><span class="num">${esc(G.school.name)} ${lm.score[0]} - ${lm.score[1]} ${esc(lm.opp)}</span></div>${lm.mvpName?`<div class="center small">活躍：${esc(lm.mvpName)}</div>`:''}<div style="margin-top:6px">${b('詳細を見る','lastMatch',{},'sm')}</div></section>`:''}
 <section class="card"><h3>今季の打撃成績</h3><div class="tw"><table class="t"><tr><th class="l">選手</th><th>試</th><th>打数</th><th>打率</th><th>安</th><th>本</th><th>点</th><th>盗</th><th>四</th><th>三振</th></tr>${batT||'<tr><td colspan="10" class="muted">まだ試合がありません</td></tr>'}</table></div></section>
 <section class="card"><h3>今季の投手成績</h3><div class="tw"><table class="t"><tr><th class="l">選手</th><th>試</th><th>勝</th><th>敗</th><th>回</th><th>防御率</th><th>奪三振</th><th>四死球</th><th>被安打</th></tr>${pitT||'<tr><td colspan="9" class="muted">まだ試合がありません</td></tr>'}</table></div></section>
 <section class="card"><h3>年間スケジュール</h3><div class="small">5月 春季地区大会 → 7月 甲子園予選（${G.school.pref}大会） → 8月 甲子園 → 8月末 夏合宿・U-18 → 9月 秋季地区予選・県大会 → 10月 ${G.school.region}地区大会 → 11月 神宮大会 → 12月 冬合宿 → 1月 選抜出場校発表 → 2月 予算委員会 → 3月 選抜高校野球（出場時）／招待大会・卒業</div><div class="hint">選抜（春の甲子園）は秋の地区大会の成績で選ばれます（地区ごとの枠：${Object.entries(SENBATSU_SLOTS).map(x=>x[0]+x[1]).join('・')}）。神宮大会優勝で地区の枠が1つ増える「神宮枠」、県大会ベスト8以上の公立・文武両道校などが選ばれる「21世紀枠」もあります。</div></section>`;}

/* ================= 試合画面 ================= */
function startMatchUI(ctx,mode){const m=createMatch(ctx.opp,ctx.kind,ctx.label);if(mode!=='manager'&&mode!=='action'&&mode!=='card')m.autoUntil='end';UI.match={m,mode,ctx,phase:'play'};
 if(mode==='action'){startActionUI();return;}
 if(mode==='card'){startCardUI();return;}
 if(mode==='auto'){let g=0;while(!m.done&&g++<3000)m.step();finishMatch();return;}
 if(mode==='manager')runUntilDecision();
 renderMatch();}
function runUntilDecision(){const m=UI.match.m;let g=0;while(!m.done&&g++<3000){if(m.needsDecision())break;m.step();}}
function runHalfInning(){const m=UI.match.m;const inn=m.inn,top=m.top;let g=0;while(!m.done&&g++<200){m.step();if(m.inn!==inn||m.top!==top)break;}}
function lineScoreHtml(m,A,B,line,score){const n=Math.max(9,m.inn||9);const hits=t=>sum(Object.values(t.stats).map(s=>s.h));const row=(name,i,t)=>`<tr><td class="tn">${esc(name)}</td>${Array.from({length:n},(_,k)=>`<td>${line[i][k]==null?'':line[i][k]}</td>`).join('')}<td class="tot">${score[i]}</td><td>${t?hits(t):''}</td></tr>`;return `<div class="ls"><table><tr><th class="tn"></th>${Array.from({length:n},(_,k)=>`<th>${k+1}</th>`).join('')}<th>R</th><th>H</th></tr>${row(A.name,0,A)}${row(B.name,1,B)}</table></div>`;}
function logHtml(log,limit){const l=limit?log.slice(-limit):log;return `<div class="log" id="mlog">${l.map(x=>`<div class="${x.kind}">${esc(x.text)}</div>`).join('')}</div>`;}
function renderMatch(){const {m,mode,ctx}=UI.match;const s=m.situation();const d=mode==='manager'?m.needsDecision():null;const u=m.user();const def=m.def(),bat=m.bat();
 const sit=`<div class="sit"><div><div class="diamond"><i class="b2 ${m.bases[1]?'on':''}"></i><i class="b3 ${m.bases[2]?'on':''}"></i><i class="b1 ${m.bases[0]?'on':''}"></i></div><div class="outs">${[0,1,2].map(i=>`<i class="${m.outs>i?'on':''}"></i>`).join('')}</div></div><div class="small"><b>${s.inn}回${s.top?'表':'裏'}</b> ${esc(s.batTeam)}の攻撃 ${m.outs}アウト<br>打者 ${s.order}番 <b>${esc(s.batter.name)}</b>（${s.batPos}・${s.batter.bats}打）<br>投手 <b>${esc(s.pitcher.name)}</b>（${s.pc}球${m.tired(def,s.pitcher)>0.2?'・疲れ':''}）</div></div>`;
 let ctrl='';
 if(mode==='digest')ctrl=`<div class="dec">${b('次の半回へ','mNextHalf',{},'primary')}${b('3イニング進める','mNext3',{},'')}${b('最後まで','mToEnd',{},'')}</div>`;
 else if(mode==='manager'){
  if(d&&d.side==='bat'){const t=bat;ctrl=`<div class="hint">攻撃の指示（${esc(s.batter.name)}の打席）</div><div class="dec">${b('強攻','mCmd',{c:'none'},'primary')}${d.opts.includes('bunt')?b('送りバント','mCmd',{c:'bunt'}):''}${d.opts.includes('steal')?b('盗塁','mCmd',{c:'steal'}):''}${d.opts.includes('hitrun')?b('エンドラン','mCmd',{c:'hitrun'}):''}${d.opts.includes('pinch')?b('代打','mPinchList',{}):''}${d.opts.includes('pinchrun')?b('代走','mPinchRunList',{}):''}</div><div class="dec">${b('この回おまかせ','mAutoInn',{},'sm ghost')}${b('最後までおまかせ','mAutoEnd',{},'sm ghost')}</div>`;}
  else if(d&&d.side==='def'){ctrl=`<div class="hint">守備の指示（投手 ${esc(def.pitcher.name)} ${s.pc}球${d.tired>0.2?'・かなり疲れている':d.tired>0.1?'・少し疲れ':''}）</div><div class="dec">${b('続投','mCmd',{c:'none'},'primary')}${d.opts.includes('change')?b('投手交代','mChangeList',{}):''}${d.opts.includes('ibb')?b('敬遠','mCmd',{c:'ibb'}):''}${d.opts.includes('infield')?b('前進守備','mInfield',{v:1}):''}${d.opts.includes('normal')?b('定位置に戻す','mInfield',{v:0}):''}${d.opts.includes('timeout')?b('タイム（残'+(3-def.mound)+'）','mTimeout',{}):''}</div><div class="dec">${b('この回おまかせ','mAutoInn',{},'sm ghost')}${b('最後までおまかせ','mAutoEnd',{},'sm ghost')}</div>`;}
  else ctrl=`<div class="dec">${b('進める','mCont',{},'primary')}</div>`;}
 const sub=UI.match.sub||'';
 $('#modal').innerHTML=`<h2>${esc(ctx.label)}</h2>${lineScoreHtml(m,m.A,m.B,m.line,m.score)}${sit}${sub}${ctrl}${logHtml(m.log,40)}`;const lg=$('#mlog');if(lg)lg.scrollTop=lg.scrollHeight;}
function afterStep(){const m=UI.match.m;UI.match.sub='';if(m.done){finishMatch();return;}if(UI.match.mode==='manager')runUntilDecision();if(m.done){finishMatch();return;}renderMatch();}
ACT.mNextHalf=()=>{runHalfInning();afterStep();};
ACT.mNext3=()=>{for(let i=0;i<6;i++){if(UI.match.m.done)break;runHalfInning();}afterStep();};
ACT.mToEnd=()=>{const m=UI.match.m;let g=0;while(!m.done&&g++<3000)m.step();afterStep();};
ACT.mCont=()=>{const m=UI.match.m;m.step();afterStep();};
ACT.mCmd=d=>{const m=UI.match.m;m.step(d.c==='none'?null:d.c);afterStep();};
ACT.mAutoInn=()=>{const m=UI.match.m;m.autoUntil='inning';m.autoInn=m.inn;m.autoTop=m.top;m.step();afterStep();};
ACT.mAutoEnd=()=>{const m=UI.match.m;m.autoUntil='end';let g=0;while(!m.done&&g++<3000)m.step();afterStep();};
ACT.mPinchList=()=>{const m=UI.match.m;const t=m.bat();UI.match.sub=`<div class="card"><b class="small">代打を選択</b><div class="wrap">${t.bench.map(p=>b(esc(p.name)+' '+p.pos+' '+letter(batRating(p)),'mPinch',{id:p.id},'sm')).join('')}${b('やめる','mSubCancel',{},'sm ghost')}</div></div>`;renderMatch();};
ACT.mPinch=d=>{const m=UI.match.m;const t=m.bat();const np=t.bench.find(p=>p.id==d.id);if(!np)return;m.pinchHit(t,t.batIdx,np);UI.match.sub='';renderMatch();};
ACT.mPinchRunList=()=>{const m=UI.match.m;const t=m.bat();const bases=[0,1,2].filter(i=>m.bases[i]);UI.match.sub=`<div class="card"><b class="small">代走：塁と選手を選択</b>${bases.map(i=>`<div class="wrap" style="margin:4px 0"><span class="small">${['一','二','三'][i]}塁 ${esc(m.bases[i].name)} →</span>${t.bench.filter(p=>!isPitcher(p)).map(p=>b(esc(p.name)+' 走'+letter(p.bat.speed),'mPinchRun',{id:p.id,base:i},'sm')).join('')}</div>`).join('')}${b('やめる','mSubCancel',{},'sm ghost')}</div>`;renderMatch();};
ACT.mPinchRun=d=>{const m=UI.match.m;const t=m.bat();const np=t.bench.find(p=>p.id==d.id);if(!np)return;m.pinchRun(t,parseInt(d.base),np);UI.match.sub='';renderMatch();};
ACT.mChangeList=()=>{const m=UI.match.m;const t=m.def();const rel=t.bench.filter(p=>isPitcher(p)||p.sub.includes('投'));UI.match.sub=`<div class="card"><b class="small">リリーフを選択</b><div class="wrap">${rel.map(p=>b(esc(p.name)+' '+letter(pitRating(p))+' '+Math.round(p.pit.velo)+'km 疲'+Math.round(p.fatigue),'mChange',{id:p.id},'sm')).join('')}${b('やめる','mSubCancel',{},'sm ghost')}</div></div>`;renderMatch();};
ACT.mChange=d=>{const m=UI.match.m;const t=m.def();const np=t.bench.find(p=>p.id==d.id);if(!np)return;m.changePitcher(t,np);UI.match.sub='';renderMatch();};
ACT.mSubCancel=()=>{UI.match.sub='';renderMatch();};
ACT.mInfield=d=>{const m=UI.match.m;m.def().infieldIn=d.v==='1';m.addLog(m.def().infieldIn?'前進守備を敷く':'守備位置を戻す','note');renderMatch();};
ACT.mTimeout=()=>{const m=UI.match.m;if(!m.timeout(m.def()))toast('タイムはもう取れません');renderMatch();};
function finishMatch(){const {m,ctx}=UI.match;const def=TOURNEY_DEFS[ctx.kind]||TOURNEY_DEFS.practice;const res=applyMatchResult(m,{importance:def.imp,kind:ctx.kind,label:ctx.label});UI.match.phase='result';UI.match.res=res;$('#modal').innerHTML=matchResultHtml(res,true);$('#modal').scrollTop=0;}
function boxHtml(box){const bt=box.bat.map(s=>`<tr><td class="l">${esc(s.name)}</td><td>${s.ab}</td><td>${s.h}</td><td>${s.hr}</td><td>${s.rbi}</td><td>${s.bb}</td><td>${s.so}</td><td>${s.sb}</td></tr>`).join('');const pt=box.pit.map(s=>`<tr><td class="l">${esc(s.name)}${s.w?'（勝）':s.l?'（敗）':''}</td><td>${ipStr(s.ipo)}</td><td>${s.h}</td><td>${s.r}</td><td>${s.er}</td><td>${s.bb}</td><td>${s.so}</td><td>${s.np}</td></tr>`).join('');return `<div class="tw"><table class="t boxs"><tr><th class="l">打者</th><th>打数</th><th>安</th><th>本</th><th>点</th><th>四</th><th>三振</th><th>盗</th></tr>${bt}</table></div><div class="tw" style="margin-top:6px"><table class="t boxs"><tr><th class="l">投手</th><th>回</th><th>安</th><th>失</th><th>自責</th><th>四死</th><th>奪三</th><th>球数</th></tr>${pt}</table></div>`;}
function matchResultHtml(res,isNew){const n=Math.max(9,res.inn||9);const ls=`<div class="ls"><table><tr><th class="tn"></th>${Array.from({length:n},(_,k)=>`<th>${k+1}</th>`).join('')}<th>R</th></tr>${[0,1].map(i=>`<tr><td class="tn">${esc(res.teams[i])}</td>${Array.from({length:n},(_,k)=>`<td>${res.line[i][k]==null?'':res.line[i][k]}</td>`).join('')}<td class="tot">${i===res.ui?res.score[0]:res.score[1]}</td></tr>`).join('')}</table></div>`;
 return `<h2>${esc(res.label)} <span class="muted small">${esc(res.date)}</span></h2><div class="ribbon">${res.won?'勝利！':'敗戦'} ${esc(G.school.name)} ${res.score[0]} - ${res.score[1]} ${esc(res.opp)}${res.reason?'（'+esc(res.reason)+'）':''}</div>${ls}${res.mvpName?`<div class="center" style="margin:6px 0">⭐ 活躍：<b>${esc(res.mvpName)}</b></div>`:''}<b class="small">${esc(G.school.name)}</b>${boxHtml(res.box)}<details style="margin-top:6px"><summary class="small muted" style="cursor:pointer">${esc(res.opp)}の成績</summary>${boxHtml(res.oppBox)}</details><details style="margin-top:6px"><summary class="small muted" style="cursor:pointer">試合経過</summary>${logHtml(res.log)}</details><div class="hint">活躍に応じて経験値が入り、能力が成長しました。</div><div style="margin-top:10px">${isNew?b('閉じる','mClose',{},'primary big'):''}</div>`;}

 switch(ev.type){
  case 'entrance':{const ps=ev.ids.map(pById).filter(Boolean);openModal(`<h2>入学式・入部</h2><div class="hint">${G.calYear}年度の新入部員 ${ps.length}人（★はスカウトで獲得した選手）</div><div class="list" style="margin-top:8px">${ps.map(p=>`<div class="pl" style="grid-template-columns:auto 1fr auto">${avatarFor({pid:p.id,size:40})}<div><div class="nm" data-act="pdetail" data-id="${p.id}">${p.scouted?'<span class="badge">★</span> ':''}${esc(p.name)} <span class="muted small">${esc(playerPosLabel(p))} ${p.throws}投${p.bats}打 ${p.height}cm</span>${p.title?` <span class="badge gold">${esc(p.title)}</span>`:''}${p.unique.length?` <span class="badge gold">固有：${esc(p.unique[0])}</span>`:''}</div><div class="sub">${esc(p.hometown)}出身・潜在 ${esc(shownPot(p))}</div></div><div>${rk(rating(p))}</div></div>`).join('')}</div><div style="margin-top:10px">${b('入部を確認','qShift',{},'primary big')}</div>`,true);break;}
